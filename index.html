<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物の水やりチェッカ</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f7f6; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #00875a; color: white; border: none; font-weight: bold; }
        .btn-edit { background-color: #555; }
        .btn-save { background-color: #28a745; }
        .alert { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🌱 植物の水やりチェッカ</h1>
    <div class="card">
        <h3>新しい植物を追加</h3>
        <input type="text" id="name" placeholder="植物の名前（例: パキラ）">
        <input type="number" id="interval" placeholder="水やり間隔（日数）">
        <input type="date" id="lastWatered">
        <button onclick="addPlant()">+ 植物を追加する</button>
    </div>
    <div id="plantList"></div>

    <script>
        let plants = JSON.parse(localStorage.getItem('plants')) || [];
        let editingId = null;

        function save() { localStorage.setItem('plants', JSON.stringify(plants)); render(); }

        function addPlant() {
            const name = document.getElementById('name').value;
            const interval = parseInt(document.getElementById('interval').value);
            const lastWatered = document.getElementById('lastWatered').value;
            if(!name || !interval || !lastWatered) return alert("全て入力してください");
            plants.push({ id: Date.now(), name, interval, lastWatered });
            save();
        }

        function editPlant(id) { editingId = id; render(); }

        function saveEdit(id) {
            const plant = plants.find(p => p.id === id);
            plant.name = document.getElementById('edit-name').value;
            plant.interval = parseInt(document.getElementById('edit-interval').value);
            plant.lastWatered = document.getElementById('edit-last').value;
            editingId = null;
            save();
        }

        function render() {
            const list = document.getElementById('plantList');
            list.innerHTML = plants.map(p => {
                if(editingId === p.id) {
                    return `<div class="card">
                        <input type="text" id="edit-name" value="${p.name}">
                        <input type="number" id="edit-interval" value="${p.interval}">
                        <input type="date" id="edit-last" value="${p.lastWatered}">
                        <button class="btn-save" onclick="saveEdit(${p.id})">保存</button>
                    </div>`;
                }
                return `<div class="card">
                    <strong>${p.name}</strong><br>
                    間隔: ${p.interval}日ごと | 前回: ${p.lastWatered}
                    <button class="btn-edit" onclick="editPlant(${p.id})">編集</button>
                </div>`;
            }).join('');
        }
        render();
    </script>
</body>
</html>
