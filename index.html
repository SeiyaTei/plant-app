<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物水やり管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    @keyframes highlight { 0% { background-color: #d1fae5; } 100% { background-color: #ffffff; } }
    .card-highlight { animation: highlight 2s ease-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-24 relative">

  <h1 class="text-2xl font-bold mb-4 text-emerald-700 text-center">🌱 植物水やり管理</h1>

  <!-- 水量計算結果表示エリア -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-emerald-500">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">本日必要な合計水量</h2>
    <div class="flex justify-between items-baseline mb-2">
      <div>
        <span id="totalWater" class="text-3xl font-black text-emerald-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div id="soakInfo" class="text-xs text-slate-500 text-right">
        通常: <span id="normalWater">0</span>L / どぶ漬け最大: <span id="maxSoak">0</span>L
      </div>
    </div>
    <button onclick="waterAllToday()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1">
      ✨ 本日の水やりをすべて完了する
    </button>
  </div>

  <div class="flex gap-2 mb-6">
    <button onclick="exportData()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition">📤 エクスポート</button>
    <label class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition text-center cursor-pointer">
      📥 インポート <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
    </label>
  </div>

  <!-- 登録・編集フォーム -->
  <form id="plantForm" onsubmit="savePlant(event)" class="bg-white p-4 rounded-xl shadow-md mb-6">
    <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-700">新しい植物を追加</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <!-- 写真エリア -->
    <div class="mb-4 text-center">
      <div id="imagePreviewContainer" class="w-20 h-20 mx-auto mb-2 bg-slate-100 rounded-lg overflow-hidden border border-slate-200 flex items-center justify-center relative cursor-pointer" onclick="document.getElementById('imageInput').click()">
        <img id="imagePreview" class="w-full h-full object-cover hidden">
        <span id="noImageText" class="text-slate-400 text-[10px]">写真</span>
      </div>
      <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
      <input type="hidden" id="plantImage">
    </div>
    
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の名前</label>
      <input type="text" id="name" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">水やり間隔 (日)</label>
        <input type="number" id="interval" value="7" required min="1" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">1回の水量 (L)</label>
        <select id="waterSelect" onchange="toggleCustomWaterInput()" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500 bg-white mb-1">
          <option value="0.5">0.5 L</option><option value="1">1.0 L</option><option value="1.5">1.5 L</option>
          <option value="2">2.0 L</option><option value="2.5">2.5 L</option><option value="3">3.0 L</option>
          <option value="3.5">3.5 L</option><option value="4">4.0 L</option><option value="4.5">4.5 L</option>
          <option value="5">5.0 L</option><option value="custom">その他</option>
        </select>
        <input type="number" id="waterCustom" step="0.1" min="0" placeholder="水量 (L)" class="hidden w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">メモ</label>
      <textarea id="memo" rows="2" placeholder="肥料や植え替え記録など" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500"></textarea>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">前回の水やり日</label>
      <input type="date" id="lastWatered" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="flex items-center mb-4">
      <input type="checkbox" id="isSoak" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
      <label for="isSoak" class="ml-2 text-xs font-semibold text-slate-700">どぶ漬け（浸漬）で水やりする</label>
    </div>

    <div class="flex gap-2">
      <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">登録する</button>
      <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg text-sm">キャンセル</button>
    </div>
  </form>

  <div class="mb-2 flex justify-between items-center">
    <h2 class="text-sm font-bold text-slate-600">植物一覧</h2>
    <select id="sortMode" onchange="renderList()" class="text-xs bg-white border rounded-lg px-2 py-1 text-slate-700 font-semibold focus:outline-emerald-500 shadow-sm">
      <option value="nextDate">次回水やりが近い順</option><option value="created">登録順</option><option value="name">名前順</option>
    </select>
  </div>

  <div id="plantList" class="space-y-3"></div>

  <button id="scrollToTopBtn" onclick="window.scrollTo({top:0, behavior:'smooth'})" class="fixed bottom-6 right-6 bg-emerald-600 text-white p-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all z-50">▲</button>

  <script>
    let plants = JSON.parse(localStorage.getItem('plants')) || [];
    let lastEditedName = null;

    // データ移行と初期化
    function migrateData() {
      plants.forEach(p => {
        if (!p.id) p.id = Date.now() + Math.random();
        if (p.waterAmount && p.waterAmount >= 10) p.waterAmount = parseFloat((p.waterAmount / 1000).toFixed(2));
        if (p.image === undefined) p.image = null;
        if (p.memo === undefined) p.memo = "";
      });
      localStorage.setItem('plants', JSON.stringify(plants));
    }
    migrateData();
    document.getElementById('lastWatered').value = new Date().toISOString().split('T')[0];

    // 写真圧縮処理
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 300;
          let w = img.width, h = img.height;
          if (w > h) { h *= size/w; w = size; } else { w *= size/h; h = size; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('plantImage').value = dataUrl;
          document.getElementById('imagePreview').src = dataUrl;
          document.getElementById('imagePreview').classList.remove('hidden');
          document.getElementById('noImageText').classList.add('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function toggleCustomWaterInput() {
      const select = document.getElementById('waterSelect');
      const custom = document.getElementById('waterCustom');
      if (select.value === 'custom') { custom.classList.remove('hidden'); custom.required = true; }
      else { custom.classList.add('hidden'); custom.required = false; }
    }

    function renderList() {
      const listEl = document.getElementById('plantList');
      listEl.innerHTML = '';
      const sortMode = document.getElementById('sortMode').value;
      let display = [...plants];
      
      const today = new Date(); today.setHours(0,0,0,0);
      const getNext = (p) => { const d = new Date(p.lastWatered); d.setDate(d.getDate() + p.interval); return d; };

      if (sortMode === 'nextDate') display.sort((a,b) => getNext(a) - getNext(b));
      else if (sortMode === 'name') display.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
      else display.sort((a,b) => a.id - b.id);

      let normalSum = 0, maxSoak = 0;

      display.forEach((plant, idx) => {
        const nextDate = getNext(plant);
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        const amount = parseFloat(plant.waterAmount) || 0;
        
        if (diffDays <= 0) {
          if (plant.isSoak) maxSoak = Math.max(maxSoak, amount);
          else normalSum += amount;
        }

        let badgeClass = "bg-slate-100 text-slate-600", badgeText = `あと ${diffDays} 日`;
        if (diffDays === 0) { badgeClass = "bg-amber-100 text-amber-700 font-bold"; badgeText = "今日が予定日！"; }
        else if (diffDays < 0) { badgeClass = "bg-rose-100 text-rose-700 font-bold"; badgeText = `${Math.abs(diffDays)} 日遅れ！`; }

        const card = document.createElement('div');
        card.id = `plant-card-${plant.id}`;
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex gap-4 items-center";
        card.innerHTML = `
          <div class="w-16 h-16 bg-slate-100 rounded-lg overflow-hidden shrink-0">
             ${plant.image ? `<img src="${plant.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-300 text-[10px]">No img</div>`}
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-slate-800 text-sm truncate">${plant.name}</h3>
            <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeClass} mt-1">${badgeText}</span>
            <div class="text-[11px] text-slate-400 mt-1 truncate">${plant.memo || 'メモなし'}</div>
          </div>
          <div class="flex flex-col gap-2">
            <button onclick="waterNow(${plants.findIndex(p=>p.id===plant.id)})" class="bg-emerald-50 text-emerald-700 p-2 rounded-lg text-xs font-bold">💧</button>
            <button onclick="editPlant(${plants.findIndex(p=>p.id===plant.id)})" class="bg-slate-50 text-slate-500 p-2 rounded-lg text-xs">✏️</button>
          </div>
        `;
        listEl.appendChild(card);
      });
      document.getElementById('totalWater').innerText = (normalSum + maxSoak).toFixed(1);
      document.getElementById('normalWater').innerText = normalSum.toFixed(1);
      document.getElementById('maxSoak').innerText = maxSoak.toFixed(1);
    }

    function savePlant(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);
      const sel = document.getElementById('waterSelect');
      const data = {
        id: index === -1 ? Date.now() : plants[index].id,
        name: document.getElementById('name').value,
        interval: parseInt(document.getElementById('interval').value),
        waterAmount: sel.value === 'custom' ? parseFloat(document.getElementById('waterCustom').value) : parseFloat(sel.value),
        lastWatered: document.getElementById('lastWatered').value,
        isSoak: document.getElementById('isSoak').checked,
        image: document.getElementById('plantImage').value,
        memo: document.getElementById('memo').value
      };
      if (index === -1) plants.push(data); else plants[index] = data;
      localStorage.setItem('plants', JSON.stringify(plants));
      resetForm(); renderList();
    }

    function editPlant(index) {
      const p = plants[index];
      document.getElementById('name').value = p.name;
      document.getElementById('interval').value = p.interval;
      document.getElementById('lastWatered').value = p.lastWatered;
      document.getElementById('isSoak').checked = p.isSoak;
      document.getElementById('editIndex').value = index;
      document.getElementById('plantImage').value = p.image || '';
      document.getElementById('memo').value = p.memo || '';
      
      if(p.image) { document.getElementById('imagePreview').src = p.image; document.getElementById('imagePreview').classList.remove('hidden'); document.getElementById('noImageText').classList.add('hidden'); }
      
      const select = document.getElementById('waterSelect');
      const custom = document.getElementById('waterCustom');
      const presets = ["0.5", "1", "1.5", "2", "2.5", "3", "3.5", "4", "4.5", "5"];
      if(presets.includes(String(p.waterAmount))) { select.value = p.waterAmount; custom.classList.add('hidden'); }
      else { select.value = 'custom'; custom.classList.remove('hidden'); custom.value = p.waterAmount; }

      document.getElementById('formTitle').innerText = "植物の編集";
      document.getElementById('submitBtn').innerText = "更新する";
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function resetForm() {
      document.getElementById('plantForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('plantImage').value = "";
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('noImageText').classList.remove('hidden');
      document.getElementById('formTitle').innerText = "新しい植物を追加";
      document.getElementById('submitBtn').innerText = "登録する";
      document.getElementById('cancelBtn').classList.add('hidden');
      document.getElementById('waterCustom').classList.add('hidden');
    }

    function waterNow(idx) { plants[idx].lastWatered = new Date().toISOString().split('T')[0]; localStorage.setItem('plants', JSON.stringify(plants)); renderList(); }
    function waterAllToday() { const t = new Date().toISOString().split('T')[0]; plants.forEach(p => { const next = new Date(p.lastWatered); next.setDate(next.getDate() + p.interval); if(next <= new Date()) p.lastWatered = t; }); localStorage.setItem('plants', JSON.stringify(plants)); renderList(); }
    function exportData() { const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plants)); const a = document.createElement('a'); a.href = d; a.download = "plants.json"; a.click(); }
    function importData(e) { const r = new FileReader(); r.onload = (ev) => { plants = JSON.parse(ev.target.result); migrateData(); renderList(); }; r.readAsText(e.target.files[0]); }
    
    renderList();
  </script>
</body>
</html>
