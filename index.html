<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物の水やりチェッカー</title>
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/628/628283.png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- ヘッダー -->
    <header class="bg-emerald-600 text-white p-6 rounded-2xl shadow-md">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        🌱 植物の水やりチェッカー
      </h1>
      <p class="text-emerald-100 text-sm mt-1">本日水やりが必要な植物が一番上に優先表示されます</p>
    </header>

    <!-- 新規追加フォーム -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4">新しい植物を追加</h2>
      <form id="plantForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">植物の名前</label>
          <input type="text" id="plantName" placeholder="例: パキラ" required
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">水やり間隔 (日数)</label>
          <input type="number" id="waterInterval" min="1" placeholder="例: 7" required
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">前回の水やり日</label>
          <input type="date" id="lastWatered" required
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="md:col-span-3">
          <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">
            ＋ 植物を追加する
          </button>
        </div>
      </form>
    </section>

    <!-- 植物一覧 -->
    <section>
      <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center justify-between">
        <span>植物一覧</span>
        <span id="plantCount" class="text-sm font-normal text-slate-500"></span>
      </h2>
      <div id="plantList" class="space-y-3">
        <!-- JSで動的にカードが挿入されます -->
      </div>
    </section>

  </div>

  <script>
    // 1. ローカルストレージ（ブラウザ）から保存済みデータを取得（無ければ初期データ）
    let plants = JSON.parse(localStorage.getItem('my_plants')) || [
      { id: '1', name: 'ガジュマル', interval: 7, lastWatered: getPastDateStr(7) },
      { id: '2', name: 'パキラ', interval: 5, lastWatered: getPastDateStr(1) },
      { id: '3', name: 'サボテン', interval: 14, lastWatered: getPastDateStr(15) }
    ];

    // 日付計算用ヘルパー（N日前の日付文字列 YYYY-MM-DD を返す）
    function getPastDateStr(daysAgo) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return d.toISOString().split('T')[0];
    }

    // 今日の日付を取得 (YYYY-MM-DD)
    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    // 次回の水やり日を計算
    function getNextWaterDate(lastWateredStr, interval) {
      const d = new Date(lastWateredStr);
      d.setDate(d.getDate() + parseInt(interval));
      return d;
    }

    // 今日の日付と次回予定日の差分日数（残日数）を計算
    function getDaysDiff(targetDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(targetDate);
      target.setHours(0, 0, 0, 0);
      const diffTime = target - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    // 2. 優先度で並び替えて一覧を描画する関数
    function renderPlants() {
      const listEl = document.getElementById('plantList');
      listEl.innerHTML = '';

      // 本日の水やり（残日数 <= 0）が自動で上位に表示されるようソート
      plants.sort((a, b) => {
        const nextA = getNextWaterDate(a.lastWatered, a.interval);
        const nextB = getNextWaterDate(b.lastWatered, b.interval);
        const diffA = getDaysDiff(nextA);
        const diffB = getDaysDiff(nextB);
        return diffA - diffB; // 残日数が少ない（期限切れ・今日）ものを上へ
      });

      // データを保存
      localStorage.setItem('my_plants', JSON.stringify(plants));
      document.getElementById('plantCount').textContent = `全 ${plants.length} つ`;

      if (plants.length === 0) {
        listEl.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white rounded-xl">植物が登録されていません。上のフォームから追加してください。</div>`;
        return;
      }

      plants.forEach(plant => {
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        const nextDateStr = nextDate.toISOString().split('T')[0];
        const daysDiff = getDaysDiff(nextDate);

        let badgeHtml = '';
        let cardBg = 'bg-white border-slate-200';

        // 水やり状態に応じた見た目の変化
        if (daysDiff < 0) {
          badgeHtml = `<span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded-full">超過 ${Math.abs(daysDiff)}日！</span>`;
          cardBg = 'bg-red-50 border-red-300 ring-1 ring-red-300';
        } else if (daysDiff === 0) {
          badgeHtml = `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full shadow-sm animate-pulse">💧 本日水やり！</span>`;
          cardBg = 'bg-amber-50 border-amber-300 ring-2 ring-amber-400';
        } else {
          badgeHtml = `<span class="bg-slate-100 text-slate-600 text-xs font-medium px-2.5 py-1 rounded-full">あと ${daysDiff} 日</span>`;
        }

        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border shadow-sm transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${cardBg}`;
        card.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-slate-800 text-lg">${plant.name}</h3>
              ${badgeHtml}
            </div>
            <div class="text-xs text-slate-500 space-x-3">
              <span>間隔: <b>${plant.interval}日ごと</b></span>
              <span>前回の水やり: <b>${plant.lastWatered}</b></span>
              <span>次回の予定: <b>${nextDateStr}</b></span>
            </div>
          </div>
          
          <div class="flex items-center gap-2 self-end sm:self-center">
            <!-- 水やり完了ボタン -->
            <button onclick="waterPlant('${plant.id}')"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-3 py-1.5 rounded-lg transition-colors shadow-sm flex items-center gap-1">
              💧 完了
            </button>
            <!-- 削除ボタン -->
            <button onclick="deletePlant('${plant.id}')"
              class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition-colors" title="削除">
              🗑️
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // 3. 植物の追加処理
    document.getElementById('plantForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('plantName').value.trim();
      const interval = document.getElementById('waterInterval').value;
      const lastWatered = document.getElementById('lastWatered').value;

      if (!name || !interval || !lastWatered) return;

      const newPlant = {
        id: Date.now().toString(),
        name,
        interval: parseInt(interval),
        lastWatered
      };

      plants.push(newPlant);
      renderPlants();

      e.target.reset();
      document.getElementById('lastWatered').value = getTodayStr();
    });

    // 4. 水やり完了処理
    function waterPlant(id) {
      plants = plants.map(plant => {
        if (plant.id === id) {
          return { ...plant, lastWatered: getTodayStr() };
        }
        return plant;
      });
      renderPlants();
    }

    // 5. 植物の削除処理
    function deletePlant(id) {
      if (confirm('この植物を削除してもよろしいですか？')) {
        plants = plants.filter(plant => plant.id !== id);
        renderPlants();
      }
    }

    // 初期化
    document.getElementById('lastWatered').value = getTodayStr();
    renderPlants();

    // サービスワーカーの登録 (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
</body>
</html>
