<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物水やり管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-20">

  <h1 class="text-2xl font-bold mb-4 text-emerald-700 text-center">🌱 植物水やり管理</h1>

  <!-- 水量計算結果表示エリア -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-6 border-l-4 border-emerald-500">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">本日必要な合計水量</h2>
    <div class="flex justify-between items-baseline">
      <div>
        <span id="totalWater" class="text-3xl font-black text-emerald-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> ml</span>
      </div>
      <div id="soakInfo" class="text-xs text-slate-500 text-right">
        通常: <span id="normalWater">0</span>ml / どぶ漬け最大: <span id="maxSoak">0</span>ml
      </div>
    </div>
  </div>

  <!-- データバックアップ / ロード機能 -->
  <div class="flex gap-2 mb-6">
    <button onclick="exportData()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition">
      📤 エクスポート (保存)
    </button>
    <label class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition text-center cursor-pointer">
      📥 インポート (ロード)
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
    </label>
  </div>

  <!-- 登録・編集フォーム -->
  <form id="plantForm" onsubmit="savePlant(event)" class="bg-white p-4 rounded-xl shadow-md mb-6">
    <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-700">新しい植物を追加</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の名前</label>
      <input type="text" id="name" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">水やり間隔 (日)</label>
        <input type="number" id="interval" value="7" required min="1" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">1回の水量 (ml)</label>
        <input type="number" id="waterAmount" value="500" required min="0" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">前回の水やり日</label>
      <input type="date" id="lastWatered" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="flex items-center mb-4">
      <input type="checkbox" id="isSoak" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
      <label for="isSoak" class="ml-2 text-xs font-semibold text-slate-700">どぶ漬け（浸漬）で水やりする</label>
    </div>

    <div class="flex gap-2">
      <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">
        登録する
      </button>
      <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg text-sm">
        キャンセル
      </button>
    </div>
  </form>

  <!-- 植物一覧リスト（自動で次回水やりが近い順に並びます） -->
  <div class="mb-2 flex justify-between items-center">
    <h2 class="text-sm font-bold text-slate-600">植物一覧（水やり順）</h2>
    <span class="text-xs text-slate-400">次回予定が近い順</span>
  </div>
  <div id="plantList" class="space-y-3"></div>

  <script>
    let plants = JSON.parse(localStorage.getItem('plants')) || [];

    // 初期化：本日の日付をデフォルト入力
    document.getElementById('lastWatered').valueToDate = new Date();
    document.getElementById('lastWatered').value = new Date().toISOString().substring(0, 10);

    // データ保存
    function savePlantsToStorage() {
      localStorage.setItem('plants', JSON.stringify(plants));
      renderList();
    }

    // 次回水やり日の計算関数
    function getNextWaterDate(lastWatered, interval) {
      const date = new Date(lastWatered);
      date.setDate(date.getDate() + parseInt(interval));
      return date;
    }

    // リストの描画（近い順ソート機能付き）
    function renderList() {
      const listEl = document.getElementById('plantList');
      listEl.innerHTML = '';

      // 1. 次回水やり日が「近い順（昇順）」にソート
      plants.sort((a, b) => {
        const nextA = getNextWaterDate(a.lastWatered, a.interval);
        const nextB = getNextWaterDate(b.lastWatered, b.interval);
        return nextA - nextB;
      });

      let normalSum = 0;
      let maxSoak = 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      plants.forEach((plant, index) => {
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        
        // 残り日数の計算
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));

        // 本日水やりが必要な場合の計算
        if (diffDays <= 0) {
          if (plant.isSoak) {
            if (plant.waterAmount > maxSoak) maxSoak = parseInt(plant.waterAmount);
          } else {
            normalSum += parseInt(plant.waterAmount);
          }
        }

        // バッジの表示切り替え
        let badgeClass = "bg-slate-100 text-slate-600";
        let badgeText = `あと ${diffDays} 日`;
        if (diffDays === 0) {
          badgeClass = "bg-amber-100 text-amber-700 font-bold border border-amber-300";
          badgeText = "今日が予定日！";
        } else if (diffDays < 0) {
          badgeClass = "bg-rose-100 text-rose-700 font-bold border border-rose-300";
          badgeText = `${Math.abs(diffDays)} 日遅れ！`;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-bold text-slate-800 text-base">${plant.name}</h3>
              <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeClass} mt-1">${badgeText}</span>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400">次回予定</span>
              <div class="text-xs font-bold text-slate-700">${nextDate.getFullYear()}/${nextDate.getMonth()+1}/${nextDate.getDate()}</div>
            </div>
          </div>
          
          <div class="text-xs text-slate-500 mb-3 space-y-0.5">
            <div>間隔: <span class="font-semibold text-slate-700">${plant.interval}日</span> / 水量: <span class="font-semibold text-slate-700">${plant.waterAmount}ml</span> ${plant.isSoak ? '<span class="text-amber-600 font-bold">(どぶ漬け)</span>' : ''}</div>
            <div>前回水やり: ${plant.lastWatered}</div>
          </div>

          <div class="flex gap-2 pt-2 border-t border-slate-50">
            <button onclick="waterNow(${index})" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-1.5 rounded transition">
              💧 今日水やりした
            </button>
            <button onclick="editPlant(${index})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1.5 rounded">編集</button>
            <button onclick="deletePlant(${index})" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1.5 rounded">削除</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      // 合計水量の表示更新
      document.getElementById('normalWater').innerText = normalSum;
      document.getElementById('maxSoak').innerText = maxSoak;
      document.getElementById('totalWater').innerText = normalSum + maxSoak;
    }

    // 今日の水やり完了処理
    function waterNow(index) {
      const todayStr = new Date().toISOString().substring(0, 10);
      plants[index].lastWatered = todayStr;
      savePlantsToStorage();
    }

    // フォーム送信（新規保存・編集更新）
    function savePlant(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);
      const data = {
        name: document.getElementById('name').value,
        interval: parseInt(document.getElementById('interval').value),
        waterAmount: parseInt(document.getElementById('waterAmount').value),
        lastWatered: document.getElementById('lastWatered').value,
        isSoak: document.getElementById('isSoak').checked
      };

      if (index === -1) {
        plants.push(data);
      } else {
        plants[index] = data;
      }

      resetForm();
      savePlantsToStorage();
    }

    // 編集モーダル・フォームの呼出
    function editPlant(index) {
      const p = plants[index];
      document.getElementById('name').value = p.name;
      document.getElementById('interval').value = p.interval;
      document.getElementById('waterAmount').value = p.waterAmount;
      document.getElementById('lastWatered').value = p.lastWatered;
      document.getElementById('isSoak').checked = p.isSoak;
      document.getElementById('editIndex').value = index;

      document.getElementById('formTitle').innerText = "植物の編集";
      document.getElementById('submitBtn').innerText = "更新する";
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 削除処理
    function deletePlant(index) {
      if (confirm(`${plants[index].name} を削除してもよろしいですか？`)) {
        plants.splice(index, 1);
        savePlantsToStorage();
      }
    }

    // フォームの初期化
    function resetForm() {
      document.getElementById('plantForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('lastWatered').value = new Date().toISOString().substring(0, 10);
      document.getElementById('formTitle').innerText = "新しい植物を追加";
      document.getElementById('submitBtn').innerText = "登録する";
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    // データ出力 (Export)
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plants, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `plant_data_${new Date().toISOString().substring(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // データ読み込み (Import)
    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            plants = imported;
            savePlantsToStorage();
            alert("データの読み込みが完了しました！");
          } else {
            alert("正しいセーブデータ形式ではありません。");
          }
        } catch (err) {
          alert("ファイルの読み込みに失敗しました。");
        }
      };
      reader.readAsText(file);
    }

    // 初回描画
    renderList();
  </script>
</body>
</html>
