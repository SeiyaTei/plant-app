<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物水やり管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    @keyframes highlight { 0% { background-color: #d1fae5; } 100% { background-color: #ffffff; } }
    .card-highlight { animation: highlight 2s ease-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-24 relative">

  <h1 class="text-2xl font-bold mb-4 text-emerald-700 text-center">🌱 植物水やり管理</h1>

  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-emerald-500">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
      本日必要な合計水量 (<span id="todayCount">0</span>株)
    </h2>
    <div class="flex justify-between items-baseline mb-2">
      <div>
        <span id="totalWater" class="text-3xl font-black text-emerald-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-500 text-right">
        通常: <span id="normalWater">0</span>L / どぶ漬け最大: <span id="maxSoak">0</span>L
      </div>
    </div>
    <button onclick="waterAllToday()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1">
      ✨ 本日の水やりをすべて完了する
    </button>
  </div>

  <div class="bg-white p-4 rounded-xl shadow-md mb-6 border-l-4 border-blue-500">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
      明日必要な合計水量 (<span id="tomorrowCount">0</span>株)
    </h2>
    <div class="flex justify-between items-baseline">
      <div>
        <span id="tomorrowTotalWater" class="text-2xl font-black text-blue-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-500 text-right">
        通常: <span id="tomorrowNormalWater">0</span>L / どぶ漬け最大: <span id="tomorrowMaxSoak">0</span>L
      </div>
    </div>
  </div>

  <div class="flex gap-2 mb-6">
    <button onclick="exportData()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition">📤 エクスポート</button>
    <label class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition text-center cursor-pointer">
      📥 インポート
      <input type="file" id="importFile" onchange="importData(event)" class="hidden">
    </label>
  </div>

  <form id="plantForm" onsubmit="savePlant(event)" class="bg-white p-4 rounded-xl shadow-md mb-6">
    <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-700">新しい植物を追加</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の名前</label>
      <input type="text" id="name" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <!-- 写真登録・プレビュー欄 -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の写真 (任意)</label>
      <div class="flex items-center gap-3">
        <div id="imagePreviewContainer" class="w-16 h-16 rounded-lg bg-slate-50 border border-dashed border-slate-300 flex items-center justify-center overflow-hidden flex-shrink-0">
          <span id="noImageText" class="text-[10px] text-slate-400">写真なし</span>
          <img id="imagePreview" class="hidden w-full h-full object-cover" alt="プレビュー">
        </div>
        <div class="flex-1 space-y-1">
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
          <button type="button" id="removeImageBtn" onclick="removeSelectedImage()" class="hidden text-xs text-rose-500 hover:text-rose-700 font-medium">写真を解除</button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">水やり間隔 (日)</label>
        <input type="number" id="interval" value="7" required min="1" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">1回の水量 (L)</label>
        <select id="waterSelect" onchange="toggleCustomWaterInput()" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500 bg-white mb-1">
          <option value="0.5">0.5 L</option>
          <option value="1">1.0 L</option>
          <option value="1.5">1.5 L</option>
          <option value="2">2.0 L</option>
          <option value="2.5">2.5 L</option>
          <option value="3">3.0 L</option>
          <option value="3.5">3.5 L</option>
          <option value="4">4.0 L</option>
          <option value="4.5">4.5 L</option>
          <option value="5">5.0 L</option>
          <option value="5.5">5.5 L</option>
          <option value="6">6.0 L</option>
          <option value="6.5">6.5 L</option>
          <option value="7">7.0 L</option>
          <option value="7.5">7.5 L</option>
          <option value="8">8.0 L</option>
          <option value="8.5">8.5 L</option>
          <option value="9">9.0 L</option>
          <option value="9.5">9.5 L</option>
          <option value="10">10.0 L</option>
          <option value="custom">その他 (手入力)</option>
        </select>
        <input type="number" id="waterCustom" step="0.1" min="0" placeholder="水量 (L)" class="hidden w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">前回の水やり日</label>
      <input type="date" id="lastWatered" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="flex items-center mb-4">
      <input type="checkbox" id="isSoak" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
      <label for="isSoak" class="ml-2 text-xs font-semibold text-slate-700">どぶ漬け（浸漬）で水やりする</label>
    </div>

    <div class="flex gap-2">
      <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">登録する</button>
      <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg text-sm">キャンセル</button>
    </div>
  </form>

  <div class="mb-2 flex justify-between items-center">
    <h2 class="text-sm font-bold text-slate-600">植物一覧</h2>
    <select id="sortMode" onchange="renderList()" class="text-xs bg-white border rounded-lg px-2 py-1 text-slate-700 font-semibold focus:outline-emerald-500 shadow-sm">
      <option value="nextDate">次回水やりが近い順</option>
      <option value="created">登録順</option>
      <option value="name">名前順 (50音)</option>
    </select>
  </div>

  <div id="plantList" class="space-y-3"></div>

  <button id="scrollToTopBtn" onclick="scrollToTop()" class="fixed bottom-6 right-6 bg-emerald-600 text-white p-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 hover:bg-emerald-700 z-50">▲</button>

  <script>
    let plants = JSON.parse(localStorage.getItem('plants')) || [];
    let lastEditedId = null;
    let currentImageBase64 = null;

    // データ移行（マイグレーション）
    function migrateData() {
      let isMigrated = false;
      plants.forEach(p => {
        if (!p.id) { p.id = Date.now() + Math.random(); isMigrated = true; }
        if (p.waterAmount && p.waterAmount >= 10) { p.waterAmount = parseFloat((p.waterAmount / 1000).toFixed(2)); isMigrated = true; }
        if (p.image === undefined) { p.image = null; isMigrated = true; }
      });
      if (isMigrated) {
        try {
          localStorage.setItem('plants', JSON.stringify(plants));
        } catch (e) {
          console.error("Migration save failed:", e);
        }
      }
    }

    // 画像の自動リサイズ＆圧縮 (長辺400px / JPEG 70%)
    function compressImage(file, maxDimension = 400, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        currentImageBase64 = await compressImage(file, 400, 0.7);
        updateImagePreview(currentImageBase64);
      } catch (err) {
        alert("画像の圧縮処理に失敗しました。別の画像をお試しください。");
        removeSelectedImage();
      }
    }

    function updateImagePreview(base64) {
      const previewImg = document.getElementById('imagePreview');
      const noImageText = document.getElementById('noImageText');
      const removeBtn = document.getElementById('removeImageBtn');

      if (base64) {
        previewImg.src = base64;
        previewImg.classList.remove('hidden');
        noImageText.classList.add('hidden');
        removeBtn.classList.remove('hidden');
      } else {
        previewImg.src = '';
        previewImg.classList.add('hidden');
        noImageText.classList.remove('hidden');
        removeBtn.classList.add('hidden');
        document.getElementById('imageInput').value = '';
      }
    }

    function removeSelectedImage() {
      currentImageBase64 = null;
      updateImagePreview(null);
    }

    function getTodayString() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    migrateData();
    document.getElementById('lastWatered').value = getTodayString();

    function toggleCustomWaterInput() {
      const select = document.getElementById('waterSelect');
      const customInput = document.getElementById('waterCustom');
      if (select.value === 'custom') { customInput.classList.remove('hidden'); customInput.required = true; }
      else { customInput.classList.add('hidden'); customInput.required = false; }
    }

    function getSelectedWaterAmount() {
      const select = document.getElementById('waterSelect');
      return select.value === 'custom' ? (parseFloat(document.getElementById('waterCustom').value) || 0) : parseFloat(select.value);
    }

    function setSelectedWaterAmount(val) {
      const select = document.getElementById('waterSelect');
      const customInput = document.getElementById('waterCustom');
      const stringVal = String(val);
      
      // selectのオプションに該当する値があるか動的に判定
      const hasOption = Array.from(select.options).some(opt => opt.value === stringVal);
      if (hasOption) { 
        select.value = stringVal; 
        customInput.classList.add('hidden'); 
      } else { 
        select.value = 'custom'; 
        customInput.classList.remove('hidden'); 
        customInput.value = val; 
      }
    }

    function savePlantsToStorage() {
      try {
        localStorage.setItem('plants', JSON.stringify(plants));
        renderList();
      } catch (e) {
        alert("LocalStorageの容量上限に達しました。不要な植物を削除するか、写真の登録数を調整してください。");
      }
    }

    function getNextWaterDate(lastWatered, interval) { const date = new Date(lastWatered); date.setDate(date.getDate() + parseInt(interval)); return date; }

    function renderList() {
      const listEl = document.getElementById('plantList');
      listEl.innerHTML = '';
      const sortMode = document.getElementById('sortMode').value;
      let displayPlants = [...plants];

      if (sortMode === 'nextDate') displayPlants.sort((a, b) => getNextWaterDate(a.lastWatered, a.interval) - getNextWaterDate(b.lastWatered, b.interval));
      else if (sortMode === 'name') displayPlants.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      else if (sortMode === 'created') displayPlants.sort((a, b) => a.id - b.id);

      let todayNormal = 0, todayMaxSoak = 0, todayCount = 0;
      let tomorrowNormal = 0, tomorrowMaxSoak = 0, tomorrowCount = 0;
      const today = new Date(); today.setHours(0, 0, 0, 0);

      displayPlants.forEach((plant) => {
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        const amount = parseFloat(plant.waterAmount) || 0;

        if (diffDays <= 0) {
          todayCount++;
          if (plant.isSoak) todayMaxSoak = Math.max(todayMaxSoak, amount); else todayNormal += amount;
        } else if (diffDays === 1) {
          tomorrowCount++;
          if (plant.isSoak) tomorrowMaxSoak = Math.max(tomorrowMaxSoak, amount); else tomorrowNormal += amount;
        }

        let badgeClass = "bg-slate-100 text-slate-600";
        let badgeText = `あと${diffDays}日`;
        if (diffDays <= 0) {
            if (diffDays === 0) { badgeClass = "bg-amber-100 text-amber-700 font-bold border border-amber-300"; badgeText = "本日水やり"; }
            else { badgeClass = "bg-rose-100 text-rose-700 font-bold border border-rose-300"; badgeText = Math.abs(diffDays)+'日遅れ'; }
        } else if (diffDays === 1) {
            badgeClass = "bg-blue-100 text-blue-600 font-bold border border-blue-200";
            badgeText = "明日水やり";
        }

        const card = document.createElement('div');
        card.id = `plant-card-${plant.id}`;
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative";
        
        card.innerHTML = `
          <div class="flex gap-3 items-start mb-2">
            ${plant.image ? `
              <div class="w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 bg-slate-100 border border-slate-200">
                <img src="${plant.image}" alt="${plant.name}" class="w-full h-full object-cover">
              </div>
            ` : ''}
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start gap-1 mb-1">
                <div class="min-w-0 pr-1">
                  <h3 class="font-bold text-slate-800 text-base break-words leading-tight">${plant.name}</h3>
                  <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeClass} mt-1">${badgeText}</span>
                </div>
                <div class="text-right flex-shrink-0">
                  <span class="text-[10px] text-slate-400 block whitespace-nowrap">次回予定</span>
                  <div class="text-xs font-bold text-slate-700 whitespace-nowrap">${nextDate.getMonth()+1}/${nextDate.getDate()}</div>
                </div>
              </div>
              <div class="text-xs text-slate-500 space-y-0.5">
                <div>間隔: ${plant.interval}日 / 水量: ${amount} L ${plant.isSoak ? '<span class="text-amber-600 font-bold">(どぶ漬け)</span>' : ''}</div>
                <div>前回水やり: ${plant.lastWatered}</div>
              </div>
            </div>
          </div>
          <div class="flex gap-2 pt-2 border-t border-slate-50">
            <button onclick="waterNow(${plants.findIndex(p => p.id === plant.id)})" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-1.5 rounded transition">💧 本日水やり完了</button>
            <button onclick="editPlant(${plants.findIndex(p => p.id === plant.id)})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1.5 rounded">編集</button>
            <button onclick="deletePlant(${plants.findIndex(p => p.id === plant.id)})" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1.5 rounded">削除</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('todayCount').innerText = todayCount;
      document.getElementById('normalWater').innerText = parseFloat(todayNormal.toFixed(2));
      document.getElementById('maxSoak').innerText = parseFloat(todayMaxSoak.toFixed(2));
      document.getElementById('totalWater').innerText = parseFloat((todayNormal + todayMaxSoak).toFixed(2));

      document.getElementById('tomorrowCount').innerText = tomorrowCount;
      document.getElementById('tomorrowNormalWater').innerText = parseFloat(tomorrowNormal.toFixed(2));
      document.getElementById('tomorrowMaxSoak').innerText = parseFloat(tomorrowMaxSoak.toFixed(2));
      document.getElementById('tomorrowTotalWater').innerText = parseFloat((tomorrowNormal + tomorrowMaxSoak).toFixed(2));

      if (lastEditedId) {
        setTimeout(() => {
          const target = document.getElementById(`plant-card-${lastEditedId}`);
          if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); target.classList.add('card-highlight'); }
          lastEditedId = null;
        }, 100);
      }
    }

    function waterNow(index) { plants[index].lastWatered = getTodayString(); lastEditedId = plants[index].id; savePlantsToStorage(); }
    
    function waterAllToday() {
      const today = new Date(); today.setHours(0,0,0,0);
      let count = 0;
      plants.forEach(p => { 
        const nextDate = getNextWaterDate(p.lastWatered, p.interval);
        nextDate.setHours(0,0,0,0);
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        if (diffDays <= 0) { 
          p.lastWatered = getTodayString(); 
          count++; 
        }
      });
      if (count > 0) { savePlantsToStorage(); alert(`${count}件完了しました`); } else alert("対象なし");
    }

    function savePlant(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);
      const data = {
        id: index === -1 ? Date.now() : plants[index].id,
        name: document.getElementById('name').value,
        interval: parseInt(document.getElementById('interval').value),
        waterAmount: getSelectedWaterAmount(),
        lastWatered: document.getElementById('lastWatered').value,
        isSoak: document.getElementById('isSoak').checked,
        image: currentImageBase64 || null
      };

      if (index === -1) plants.push(data); else plants[index] = data;
      lastEditedId = data.id;
      resetForm();
      savePlantsToStorage();
    }

    function editPlant(index) {
      const p = plants[index];
      document.getElementById('name').value = p.name;
      document.getElementById('interval').value = p.interval;
      setSelectedWaterAmount(p.waterAmount);
      document.getElementById('lastWatered').value = p.lastWatered;
      document.getElementById('isSoak').checked = p.isSoak;
      
      currentImageBase64 = p.image || null;
      updateImagePreview(currentImageBase64);

      document.getElementById('editIndex').value = index;
      document.getElementById('formTitle').innerText = "植物の編集";
      document.getElementById('submitBtn').innerText = "更新する";
      document.getElementById('cancelBtn').classList.remove('hidden');
      document.getElementById('plantForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function deletePlant(index) { if (confirm("削除しますか？")) { plants.splice(index, 1); savePlantsToStorage(); } }

    function resetForm() {
      document.getElementById('plantForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('lastWatered').value = getTodayString();
      setSelectedWaterAmount(0.5);
      removeSelectedImage();
      document.getElementById('formTitle').innerText = "新しい植物を追加";
      document.getElementById('submitBtn').innerText = "登録する";
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.addEventListener('scroll', () => { 
        const btn = document.getElementById('scrollToTopBtn'); 
        if (window.scrollY > 300) {
            btn.classList.remove('opacity-0', 'pointer-events-none');
            btn.classList.add('opacity-100');
        } else {
            btn.classList.add('opacity-0', 'pointer-events-none');
            btn.classList.remove('opacity-100');
        }
    });

    function exportData() {
      const d = document.createElement('a');
      d.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plants));
      d.download = "plants.json";
      d.click();
    }

    function importData(e) { 
      const f = e.target.files[0]; 
      if (!f) return; 
      const r = new FileReader(); 
      r.onload = (e) => { 
        try {
          plants = JSON.parse(e.target.result); 
          migrateData(); 
          savePlantsToStorage(); 
          alert("インポートが完了しました");
        } catch (err) {
          alert("ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。");
        }
      }; 
      r.readAsText(f); 
    }

    renderList();
  </script>
</body>
        </html>
