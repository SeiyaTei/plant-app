<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物水やり管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* スムーススクロール */
    html { scroll-behavior: smooth; }
    /* ハイライトアニメーション */
    @keyframes highlight {
      0% { background-color: #d1fae5; }
      100% { background-color: #ffffff; }
    }
    .card-highlight {
      animation: highlight 2s ease-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-24 relative">

  <h1 class="text-2xl font-bold mb-4 text-emerald-700 text-center">🌱 植物水やり管理</h1>

  <!-- 本日必要な水量・株数エリア -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-emerald-500">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">🌱 本日必要な水やり</h2>
      <span id="todayCount" class="text-xs font-bold bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full">0株</span>
    </div>
    
    <div class="flex justify-between items-baseline mb-2">
      <div>
        <span id="totalWater" class="text-3xl font-black text-emerald-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-400 text-right">
        通常: <span id="normalWater">0</span>L / 漬け最大: <span id="maxSoak">0</span>L
      </div>
    </div>

    <!-- 本日の水やり一括完了ボタン -->
    <button type="button" onclick="waterAllToday()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1 mt-1">
      ✨ 本日の水やりをすべて完了する
    </button>
  </div>

  <!-- 明日必要な水量・株数エリア (独立カード) -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-blue-500">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">📅 明日必要な水やり (事前準備)</h2>
      <span id="tomorrowCount" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full">0株</span>
    </div>
    
    <div class="flex justify-between items-baseline">
      <div>
        <span id="tomorrowTotalWater" class="text-3xl font-black text-blue-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-400 text-right">
        通常: <span id="tomorrowNormalWater">0</span>L / 漬け最大: <span id="tomorrowMaxSoak">0</span>L
      </div>
    </div>
  </div>

  <!-- データバックアップ / ロード機能 -->
  <div class="flex gap-2 mb-6">
    <button type="button" onclick="exportData()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition">
      📤 エクスポート (保存)
    </button>
    <label class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition text-center cursor-pointer">
      📥 インポート (ロード)
      <input type="file" id="importFile" accept=".json,text/plain,application/json,*/*" onchange="importData(this)" class="hidden">
    </label>
  </div>

  <!-- 登録・編集フォーム -->
  <div id="plantFormContainer" class="bg-white p-4 rounded-xl shadow-md mb-6">
    <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-700">新しい植物を追加</h2>
    <input type="hidden" id="editIndex" value="-1">
    <input type="hidden" id="imageData" value="">
    
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の名前</label>
      <input type="text" id="name" placeholder="例: パキラ" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <!-- 写真選択エリア -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の写真 (任意)</label>
      <div class="flex items-center gap-3">
        <div id="formImagePreview" class="w-14 h-14 rounded-lg bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center overflow-hidden flex-shrink-0 text-slate-400 text-xs">
          なし
        </div>
        <div class="flex-1">
          <label class="inline-block bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg cursor-pointer transition border border-slate-200">
            📷 写真を選択
            <input type="file" accept="image/*" onchange="handleFormImageSelect(this)" class="hidden">
          </label>
          <button type="button" id="removeImageBtn" onclick="removeFormImage()" class="hidden text-xs text-rose-500 ml-2 hover:underline">削除</button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">水やり間隔 (日)</label>
        <input type="number" id="interval" value="7" min="1" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">1回の水量 (L)</label>
        <select id="waterSelect" onchange="toggleCustomWaterInput()" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500 bg-white mb-1">
          <option value="0.5">0.5 L</option>
          <option value="1">1.0 L</option>
          <option value="1.5">1.5 L</option>
          <option value="2">2.0 L</option>
          <option value="2.5">2.5 L</option>
          <option value="3">3.0 L</option>
          <option value="3.5">3.5 L</option>
          <option value="4">4.0 L</option>
          <option value="4.5">4.5 L</option>
          <option value="5">5.0 L</option>
          <option value="custom">その他 (手入力)</option>
        </select>
        <input type="number" id="waterCustom" step="0.1" min="0" placeholder="水量 (L)" class="hidden w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">前回の水やり日</label>
      <input type="date" id="lastWatered" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="flex items-center mb-4">
      <input type="checkbox" id="isSoak" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
      <label for="isSoak" class="ml-2 text-xs font-semibold text-slate-700">どぶ漬け（浸漬）で水やりする</label>
    </div>

    <div class="flex gap-2">
      <button type="button" id="submitBtn" onclick="savePlant()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">
        登録する
      </button>
      <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg text-sm">
        キャンセル
      </button>
    </div>
  </div>

  <!-- 植物一覧ヘッダー -->
  <div class="mb-2 flex justify-between items-center">
    <h2 class="text-sm font-bold text-slate-600">植物一覧</h2>
    <div class="flex items-center gap-1">
      <label for="sortMode" class="text-xs text-slate-400 font-semibold">並び順:</label>
      <select id="sortMode" onchange="renderList()" class="text-xs bg-white border rounded-lg px-2 py-1 text-slate-700 font-semibold focus:outline-emerald-500 shadow-sm">
        <option value="nextDate">次回水やりが近い順</option>
        <option value="created">登録順</option>
        <option value="name">名前順 (50音)</option>
      </select>
    </div>
  </div>

  <div id="plantList" class="space-y-3"></div>

  <!-- カードからの直接画像アップロード用非表示input -->
  <input type="file" id="cardImageInput" accept="image/*" class="hidden" onchange="handleCardImageSelect(this)">

  <!-- トップに戻るボタン -->
  <button id="scrollToTopBtn" onclick="scrollToTop()" class="fixed bottom-6 right-6 bg-emerald-600 text-white p-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 hover:bg-emerald-700 focus:outline-none z-50">
    ▲
  </button>

  <script>
    let plants = [];
    let lastEditedName = null;
    let currentTargetPlantIndex = null; // カードから写真を選択する対象のインデックス

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 安全なデータ整形関数
    function normalizePlant(item) {
      if (!item || typeof item !== 'object') return null;

      const name = item.name || item.plantName || item.title || '無題の植物';
      let interval = parseInt(item.interval || item.intervalDays || item.waterInterval || 7, 10);
      if (isNaN(interval) || interval <= 0) interval = 7;

      let waterAmount = parseFloat(item.waterAmount || item.water || item.amount || 0.5);
      if (isNaN(waterAmount)) waterAmount = 0.5;
      if (waterAmount >= 10) waterAmount = parseFloat((waterAmount / 1000).toFixed(2));

      let lastWatered = item.lastWatered || item.lastWateredDate || item.date || getTodayString();

      return {
        id: item.id || (Date.now() + Math.random()),
        name: String(name),
        interval: interval,
        waterAmount: waterAmount,
        lastWatered: String(lastWatered),
        isSoak: Boolean(item.isSoak || item.soak || item.dobu),
        image: item.image || item.photo || null
      };
    }

    // 画像圧縮処理（長辺400px、画質75%）
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 400;

          if (width > height) {
            if (width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 軽量なJPEG DataURLを生成
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // フォームの写真選択ハンドラ
    function handleFormImageSelect(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      compressImage(file, function(compressedBase64) {
        document.getElementById('imageData').value = compressedBase64;
        const preview = document.getElementById('formImagePreview');
        preview.innerHTML = `<img src="${compressedBase64}" class="w-full h-full object-cover">`;
        document.getElementById('removeImageBtn').classList.remove('hidden');
      });
      input.value = '';
    }

    // フォームの写真削除
    function removeFormImage() {
      document.getElementById('imageData').value = '';
      const preview = document.getElementById('formImagePreview');
      preview.innerHTML = 'なし';
      document.getElementById('removeImageBtn').classList.add('hidden');
    }

    // カードからのダイレクト写真追加
    function triggerCardImageSelect(originalIndex) {
      currentTargetPlantIndex = originalIndex;
      document.getElementById('cardImageInput').click();
    }

    function handleCardImageSelect(input) {
      const file = input.files && input.files[0];
      if (!file || currentTargetPlantIndex === null) return;

      compressImage(file, function(compressedBase64) {
        if (plants[currentTargetPlantIndex]) {
          plants[currentTargetPlantIndex].image = compressedBase64;
          savePlantsToStorage();
        }
        currentTargetPlantIndex = null;
      });
      input.value = '';
    }

    // ローカルストレージからの読み込み
    function loadPlantsFromStorage() {
      try {
        const stored = localStorage.getItem('plants');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed)) {
            plants = parsed.map(normalizePlant).filter(Boolean);
          }
        }
      } catch (err) {
        console.error("ストレージ読み込みエラー:", err);
        plants = [];
      }
    }

    // ローカルストレージへの保存
    function savePlantsToStorage() {
      try {
        localStorage.setItem('plants', JSON.stringify(plants));
      } catch (err) {
        console.error("ストレージ保存エラー:", err);
        alert("ストレージ容量上限に達した可能性があります。画像を減らすか整理してください。");
      }
      renderList();
    }

    // 初期化処理
    loadPlantsFromStorage();
    document.getElementById('lastWatered').value = getTodayString();

    function toggleCustomWaterInput() {
      const select = document.getElementById('waterSelect');
      const customInput = document.getElementById('waterCustom');
      if (select.value === 'custom') {
        customInput.classList.remove('hidden');
      } else {
        customInput.classList.add('hidden');
      }
    }

    function getSelectedWaterAmount() {
      const select = document.getElementById('waterSelect');
      if (select.value === 'custom') {
        return parseFloat(document.getElementById('waterCustom').value) || 0;
      }
      return parseFloat(select.value);
    }

    function setSelectedWaterAmount(val) {
      const select = document.getElementById('waterSelect');
      const customInput = document.getElementById('waterCustom');
      const presetValues = ["0.5", "1", "1.5", "2", "2.5", "3", "3.5", "4", "4.5", "5"];

      if (presetValues.includes(String(val))) {
        select.value = String(val);
        customInput.classList.add('hidden');
        customInput.value = '';
      } else {
        select.value = 'custom';
        customInput.classList.remove('hidden');
        customInput.value = val;
      }
    }

    function getNextWaterDate(lastWatered, interval) {
      const date = new Date(lastWatered);
      date.setDate(date.getDate() + parseInt(interval, 10));
      return date;
    }

    // 植物リストの描画（カードに写真配置エリアを追加）
    function renderList() {
      const listEl = document.getElementById('plantList');
      listEl.innerHTML = '';

      const sortMode = document.getElementById('sortMode').value;
      let displayPlants = [...plants];

      if (sortMode === 'nextDate') {
        displayPlants.sort((a, b) => {
          const nextA = getNextWaterDate(a.lastWatered, a.interval);
          const nextB = getNextWaterDate(b.lastWatered, b.interval);
          return nextA - nextB;
        });
      } else if (sortMode === 'name') {
        displayPlants.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      } else if (sortMode === 'created') {
        displayPlants.sort((a, b) => a.id - b.id);
      }

      let normalSum = 0;
      let maxSoak = 0;
      let todayPlantCount = 0;

      let tomorrowNormalSum = 0;
      let tomorrowMaxSoak = 0;
      let tomorrowPlantCount = 0;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      displayPlants.forEach((plant) => {
        const originalIndex = plants.findIndex(p => p.id === plant.id);
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        const amount = parseFloat(plant.waterAmount) || 0;

        if (diffDays <= 0) {
          todayPlantCount++;
          if (plant.isSoak) {
            if (amount > maxSoak) maxSoak = amount;
          } else {
            normalSum += amount;
          }
        }

        if (diffDays === 1) {
          tomorrowPlantCount++;
          if (plant.isSoak) {
            if (amount > tomorrowMaxSoak) tomorrowMaxSoak = amount;
          } else {
            tomorrowNormalSum += amount;
          }
        }

        let badgeClass = "bg-slate-100 text-slate-600";
        let badgeText = `あと ${diffDays} 日`;
        if (diffDays === 0) {
          badgeClass = "bg-amber-100 text-amber-700 font-bold border border-amber-300";
          badgeText = "今日が予定日！";
        } else if (diffDays === 1) {
          badgeClass = "bg-blue-100 text-blue-700 font-bold border border-blue-300";
          badgeText = "明日が予定日";
        } else if (diffDays < 0) {
          badgeClass = "bg-rose-100 text-rose-700 font-bold border border-rose-300";
          badgeText = `${Math.abs(diffDays)} 日遅れ！`;
        }

        // 写真エリアのHTML生成
        let photoAreaHtml = '';
        if (plant.image) {
          photoAreaHtml = `
            <div onclick="triggerCardImageSelect(${originalIndex})" class="w-16 h-16 rounded-lg overflow-hidden bg-slate-100 border border-slate-200 cursor-pointer relative group flex-shrink-0 shadow-sm">
              <img src="${plant.image}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-[10px] font-bold">変更</div>
            </div>
          `;
        } else {
          photoAreaHtml = `
            <div onclick="triggerCardImageSelect(${originalIndex})" class="w-16 h-16 rounded-lg border-2 border-dashed border-slate-200 hover:border-emerald-400 bg-slate-50 hover:bg-emerald-50/50 flex flex-col items-center justify-center cursor-pointer transition flex-shrink-0 text-slate-400 hover:text-emerald-600">
              <span class="text-xs">📷</span>
              <span class="text-[9px] font-bold mt-0.5">写真追加</span>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.id = `plant-card-${encodeURIComponent(plant.name)}`;
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative transition-all";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2 mb-2">
            <!-- 左側：名前・タグ・水やり詳細 -->
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-slate-800 text-base truncate">${plant.name}</h3>
              <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeClass} mt-1 mb-2">${badgeText}</span>
              
              <div class="text-xs text-slate-500 space-y-0.5">
                <div>間隔: <span class="font-semibold text-slate-700">${plant.interval}日</span> / 水量: <span class="font-semibold text-slate-700">${amount} L</span> ${plant.isSoak ? '<span class="text-amber-600 font-bold">(どぶ漬け)</span>' : ''}</div>
                <div>前回水やり: ${plant.lastWatered}</div>
              </div>
            </div>

            <!-- 中央/右側：画像エリア（ご指定の赤枠部分） -->
            ${photoAreaHtml}

            <!-- 右側：次回予定日 -->
            <div class="text-right flex-shrink-0">
              <span class="text-[10px] text-slate-400 block">次回予定</span>
              <div class="text-xs font-bold text-slate-700">${nextDate.getFullYear()}/${nextDate.getMonth()+1}/${nextDate.getDate()}</div>
            </div>
          </div>

          <div class="flex gap-2 pt-2 border-t border-slate-50 mt-1">
            <button type="button" onclick="waterNow(${originalIndex})" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-1.5 rounded transition">
              💧 今日水やりした
            </button>
            <button type="button" onclick="editPlant(${originalIndex})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1.5 rounded">編集</button>
            <button type="button" onclick="deletePlant(${originalIndex})" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1.5 rounded">削除</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      // 本日集計
      const total = normalSum + maxSoak;
      document.getElementById('todayCount').innerText = `${todayPlantCount}株`;
      document.getElementById('normalWater').innerText = parseFloat(normalSum.toFixed(2));
      document.getElementById('maxSoak').innerText = parseFloat(maxSoak.toFixed(2));
      document.getElementById('totalWater').innerText = parseFloat(total.toFixed(2));

      // 明日集計
      const tomorrowTotal = tomorrowNormalSum + tomorrowMaxSoak;
      document.getElementById('tomorrowCount').innerText = `${tomorrowPlantCount}株`;
      document.getElementById('tomorrowNormalWater').innerText = parseFloat(tomorrowNormalSum.toFixed(2));
      document.getElementById('tomorrowMaxSoak').innerText = parseFloat(tomorrowMaxSoak.toFixed(2));
      document.getElementById('tomorrowTotalWater').innerText = parseFloat(tomorrowTotal.toFixed(2));

      if (lastEditedName) {
        setTimeout(() => {
          const targetCard = document.getElementById(`plant-card-${encodeURIComponent(lastEditedName)}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.classList.add('card-highlight');
          }
          lastEditedName = null;
        }, 100);
      }
    }

    function waterNow(index) {
      if (plants[index]) {
        plants[index].lastWatered = getTodayString();
        lastEditedName = plants[index].name;
        savePlantsToStorage();
      }
    }

    function waterAllToday() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let count = 0;

      plants.forEach(plant => {
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        if (nextDate <= today) {
          plant.lastWatered = getTodayString();
          count++;
        }
      });

      if (count > 0) {
        savePlantsToStorage();
        alert(`${count}件の植物の水やりを完了しました！`);
      } else {
        alert("本日水やりが必要な植物はありません。");
      }
    }

    // 植物登録機能
    function savePlant() {
      const nameInput = document.getElementById('name');
      const name = nameInput.value.trim();

      if (!name) {
        alert("植物の名前を入力してください。");
        nameInput.focus();
        return;
      }

      const index = parseInt(document.getElementById('editIndex').value, 10);
      const intervalVal = parseInt(document.getElementById('interval').value, 10) || 7;
      const lastWateredVal = document.getElementById('lastWatered').value || getTodayString();
      const waterAmountVal = getSelectedWaterAmount();
      const isSoakVal = document.getElementById('isSoak').checked;
      const imageVal = document.getElementById('imageData').value || null;

      const newPlantData = {
        id: index === -1 ? (Date.now() + Math.random()) : plants[index].id,
        name: name,
        interval: intervalVal,
        waterAmount: waterAmountVal,
        lastWatered: lastWateredVal,
        isSoak: isSoakVal,
        image: imageVal
      };

      if (index === -1) {
        plants.push(newPlantData);
      } else {
        plants[index] = newPlantData;
      }

      lastEditedName = name;
      resetForm();
      savePlantsToStorage();
    }

    // 編集フォーム呼び出し
    function editPlant(index) {
      const p = plants[index];
      if (!p) return;

      document.getElementById('name').value = p.name;
      document.getElementById('interval').value = p.interval;
      setSelectedWaterAmount(p.waterAmount);
      document.getElementById('lastWatered').value = p.lastWatered;
      document.getElementById('isSoak').checked = p.isSoak;
      document.getElementById('editIndex').value = index;

      // 画像プレビューのセット
      document.getElementById('imageData').value = p.image || '';
      const preview = document.getElementById('formImagePreview');
      if (p.image) {
        preview.innerHTML = `<img src="${p.image}" class="w-full h-full object-cover">`;
        document.getElementById('removeImageBtn').classList.remove('hidden');
      } else {
        preview.innerHTML = 'なし';
        document.getElementById('removeImageBtn').classList.add('hidden');
      }

      document.getElementById('formTitle').innerText = "植物の編集";
      document.getElementById('submitBtn').innerText = "更新する";
      document.getElementById('cancelBtn').classList.remove('hidden');
      
      document.getElementById('plantFormContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function deletePlant(index) {
      if (plants[index] && confirm(`${plants[index].name} を削除してもよろしいですか？`)) {
        plants.splice(index, 1);
        savePlantsToStorage();
      }
    }

    function resetForm() {
      document.getElementById('name').value = '';
      document.getElementById('interval').value = '7';
      document.getElementById('editIndex').value = "-1";
      document.getElementById('lastWatered').value = getTodayString();
      document.getElementById('isSoak').checked = false;
      setSelectedWaterAmount(0.5);
      removeFormImage();
      
      document.getElementById('formTitle').innerText = "新しい植物を追加";
      document.getElementById('submitBtn').innerText = "登録する";
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const topBtn = document.getElementById('scrollToTopBtn');
      if (window.scrollY > 300) {
        topBtn.classList.remove('opacity-0', 'pointer-events-none');
        topBtn.classList.add('opacity-100');
      } else {
        topBtn.classList.remove('opacity-100');
        topBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    function exportData() {
      try {
        const jsonStr = JSON.stringify(plants, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `plant_data_${getTodayString()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("エクスポート中にエラーが発生しました: " + err.message);
      }
    }

    function importData(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const content = e.target.result;
          let raw = JSON.parse(content);
          let targetArray = null;

          if (Array.isArray(raw)) {
            targetArray = raw;
          } else if (raw && typeof raw === 'object') {
            const possibleKeys = ['plants', 'data', 'items', 'list', 'plantList'];
            for (let key of possibleKeys) {
              if (Array.isArray(raw[key])) {
                targetArray = raw[key];
                break;
              }
            }
            if (!targetArray) {
              for (let key in raw) {
                if (Array.isArray(raw[key])) {
                  targetArray = raw[key];
                  break;
                }
              }
            }
          }

          if (targetArray) {
            const cleaned = targetArray.map(normalizePlant).filter(Boolean);
            plants = cleaned;
            savePlantsToStorage();
            alert(`インポートが完了しました！（${plants.length}件）`);
          } else {
            alert("ファイル内に有効な植物データが見つかりませんでした。");
          }
        } catch (err) {
          alert("ファイルの読み込み・解析に失敗しました:\n" + err.message);
        } finally {
          inputEl.value = '';
        }
      };

      reader.onerror = function() {
        alert("ファイルの読み込み中にエラーが発生しました。");
        inputEl.value = '';
      };

      reader.readAsText(file, 'UTF-8');
    }

    // 初回描画
    renderList();
  </script>
</body>
</html>
