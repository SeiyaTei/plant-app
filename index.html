<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>植物水やり管理</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/628/628283.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes highlight {
      0% { background-color: #d1fae5; transform: scale(1.02); }
      100% { background-color: #ffffff; transform: scale(1); }
    }
    .card-highlight {
      animation: highlight 1.2s ease-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20 font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-30 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌱</span>
        <h1 class="text-base font-black tracking-wide">植物水やり管理</h1>
      </div>
      <span id="totalPlantCount" class="text-xs bg-emerald-700/80 px-2.5 py-1 rounded-full font-bold">0株</span>
    </div>
  </header>

  <!-- メインコンテナ -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 水量自動集計ダッシュボード -->
    <section class="space-y-3">
      <!-- 本日必要な水量 -->
      <div class="bg-white border-2 border-emerald-500 rounded-2xl p-4 shadow-sm relative overflow-hidden">
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-xs font-bold text-slate-500">本日必要な合計水量 (<span id="todayCount">0</span>株)</span>
          <span class="text-[10px] text-slate-400 font-medium" id="todayBreakdown">通常: 0L / どぶ漬け最大: 0L</span>
        </div>
        <div class="flex items-baseline gap-1 mb-3">
          <span id="todayWaterTotal" class="text-3xl font-black text-emerald-600">0</span>
          <span class="text-sm font-bold text-emerald-600">L</span>
        </div>
        <button onclick="completeAllTodayWatering()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow transition active:scale-98 flex items-center justify-center gap-1.5">
          <span>✨ 本日の水やりをすべて完了する</span>
        </button>
      </div>

      <!-- 明日必要な水量 -->
      <div class="bg-white border-l-4 border-blue-500 rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-xs font-bold text-slate-500">明日必要な合計水量 (<span id="tomorrowCount">0</span>株)</span>
          <span class="text-[10px] text-slate-400 font-medium" id="tomorrowBreakdown">通常: 0L / どぶ漬け最大: 0L</span>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="tomorrowWaterTotal" class="text-2xl font-black text-blue-600">0</span>
          <span class="text-xs font-bold text-blue-600">L</span>
        </div>
      </div>

      <!-- エクスポート/インポートボタン -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="exportData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-xl transition flex items-center justify-center gap-1">
          <span>📤 エクスポート</span>
        </button>
        <label class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-xl transition flex items-center justify-center gap-1 cursor-pointer text-center">
          <span>📥 インポート</span>
          <input type="file" id="importInput" onchange="importData(event)" class="hidden" accept=".json,application/json,text/plain,*/*">
        </label>
      </div>
    </section>

    <!-- 2. 植物の登録・編集フォーム -->
    <section id="formSection" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 id="formTitle" class="font-bold text-sm text-slate-800 border-b border-slate-100 pb-2">新しい植物を追加</h2>
      
      <form id="plantForm" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editPlantId" value="">

        <!-- 植物名 -->
        <div>
          <label class="block font-bold text-slate-600 mb-1">植物の名前 <span class="text-rose-500">*</span></label>
          <input type="text" id="inputName" required placeholder="例: モンステラ" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- 写真（カスタムボタンUI & Canvas圧縮） -->
        <div>
          <label class="block font-bold text-slate-600 mb-1">植物の写真 (任意)</label>
          <div class="flex items-center gap-3">
            <div id="imagePreviewBox" class="w-16 h-16 rounded-xl border border-dashed border-slate-300 bg-slate-50 flex items-center justify-center overflow-hidden flex-shrink-0">
              <span class="text-[10px] text-slate-400" id="previewPlaceholder">写真なし</span>
              <img id="previewImage" src="" class="w-full h-full object-cover hidden" alt="プレビュー">
            </div>
            <div class="flex-1 space-y-1.5">
              <div class="flex items-center gap-2">
                <label class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold py-1.5 px-3 rounded-lg text-xs cursor-pointer transition inline-flex items-center gap-1 shadow-sm">
                  <span>📁 ファイルを選択</span>
                  <input type="file" id="inputImage" accept="image/*" onchange="handleImageSelect(event)" class="hidden">
                </label>
                <button type="button" id="btnRemoveImage" onclick="removeSelectedImage()" class="text-xs text-rose-500 hover:text-rose-700 font-bold hidden">写真を解除</button>
              </div>
              <div id="fileNameDisplay" class="text-[11px] text-slate-400 truncate max-w-[180px]">選択されていません</div>
            </div>
          </div>
        </div>

        <!-- 間隔 & 水量 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-600 mb-1">水やり間隔 (日) <span class="text-rose-500">*</span></label>
            <input type="number" id="inputInterval" required min="1" placeholder="7" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block font-bold text-slate-600 mb-1">1回の水量 (L) <span class="text-rose-500">*</span></label>
            <!-- 0.5L刻みで10.0Lまで選択可能 -->
            <select id="selectWater" onchange="handleWaterSelectChange()" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
              <option value="0.5">0.5 L</option>
              <option value="1.0">1.0 L</option>
              <option value="1.5">1.5 L</option>
              <option value="2.0">2.0 L</option>
              <option value="2.5">2.5 L</option>
              <option value="3.0">3.0 L</option>
              <option value="3.5">3.5 L</option>
              <option value="4.0">4.0 L</option>
              <option value="4.5">4.5 L</option>
              <option value="5.0">5.0 L</option>
              <option value="5.5">5.5 L</option>
              <option value="6.0">6.0 L</option>
              <option value="6.5">6.5 L</option>
              <option value="7.0">7.0 L</option>
              <option value="7.5">7.5 L</option>
              <option value="8.0">8.0 L</option>
              <option value="8.5">8.5 L</option>
              <option value="9.0">9.0 L</option>
              <option value="9.5">9.5 L</option>
              <option value="10.0">10.0 L</option>
              <option value="custom">その他 (手入力)</option>
            </select>
            <!-- 0Lからの手入力に対応 -->
            <input type="number" step="0.1" min="0" id="inputCustomWater" placeholder="水量 (L: 0以上)" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 mt-1.5 hidden">
          </div>
        </div>

        <!-- 前回水やり日 -->
        <div>
          <label class="block font-bold text-slate-600 mb-1">前回の水やり日 <span class="text-rose-500">*</span></label>
          <input type="date" id="inputLastWatered" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
        </div>

        <!-- どぶ漬けチェック -->
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="inputIsDobudzuke" class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
          <label for="inputIsDobudzuke" class="text-xs font-bold text-slate-700 cursor-pointer">どぶ漬け（浸漬）で水やりする</label>
        </div>

        <!-- 肥料・活力剤設定アコーディオン -->
        <div class="border-t border-slate-100 pt-2 space-y-2">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="inputFertilizerEnabled" onchange="toggleFertilizerSettings()" class="w-4 h-4 text-purple-600 rounded border-slate-300 focus:ring-purple-500">
              <label for="inputFertilizerEnabled" class="text-xs font-bold text-slate-700 cursor-pointer flex items-center gap-1">
                <span>🧪 肥料・活力剤の管理を行う</span>
              </label>
            </div>
          </div>

          <!-- 肥料設定展開エリア -->
          <div id="fertilizerSettingsContainer" class="hidden bg-purple-50/60 p-3 rounded-xl border border-purple-100 space-y-2.5">
            <!-- 肥料の種類選択チップ -->
            <div>
              <label class="block font-bold text-purple-900 mb-1 text-[11px]">肥料の種類 (複数選択可)</label>
              <div class="flex flex-wrap gap-1.5">
                <label class="cursor-pointer">
                  <input type="checkbox" name="fertType" value="液肥" class="fert-type-checkbox peer hidden">
                  <span class="inline-block px-2.5 py-1 text-xs rounded-lg border border-purple-200 bg-white text-purple-700 font-bold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 shadow-sm transition">液肥</span>
                </label>
                <label class="cursor-pointer">
                  <input type="checkbox" name="fertType" value="活力剤" class="fert-type-checkbox peer hidden">
                  <span class="inline-block px-2.5 py-1 text-xs rounded-lg border border-purple-200 bg-white text-purple-700 font-bold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 shadow-sm transition">活力剤</span>
                </label>
                <label class="cursor-pointer">
                  <input type="checkbox" name="fertType" value="鉄分" class="fert-type-checkbox peer hidden">
                  <span class="inline-block px-2.5 py-1 text-xs rounded-lg border border-purple-200 bg-white text-purple-700 font-bold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 shadow-sm transition">鉄分</span>
                </label>
                <label class="cursor-pointer">
                  <input type="checkbox" name="fertType" value="固形肥料" class="fert-type-checkbox peer hidden">
                  <span class="inline-block px-2.5 py-1 text-xs rounded-lg border border-purple-200 bg-white text-purple-700 font-bold peer-checked:bg-purple-600 peer-checked:text-white peer-checked:border-purple-600 shadow-sm transition">固形肥料</span>
                </label>
              </div>
            </div>

            <!-- 頻度 & 次回状態 -->
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-bold text-purple-900 mb-1 text-[11px]">投与頻度</label>
                <select id="inputFertilizerInterval" class="w-full px-2 py-1.5 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 bg-white text-xs text-slate-700">
                  <option value="1">毎回（水やりごと）</option>
                  <option value="2">2回に1回</option>
                  <option value="3">3回に1回</option>
                  <option value="4">4回に1回</option>
                  <option value="5">5回に1回</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-purple-900 mb-1 text-[11px]">次回の水やり時</label>
                <select id="inputFertilizerCycle" class="w-full px-2 py-1.5 border border-purple-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 bg-white text-xs text-slate-700">
                  <option value="0">肥料あり（投与する）</option>
                  <option value="1">水のみ（スキップ）</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- 登録・更新ボタン -->
        <div class="flex gap-2 pt-2">
          <button type="submit" id="btnSubmitForm" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition shadow active:scale-98">
            登録する
          </button>
          <button type="button" id="btnCancelEdit" onclick="cancelEditMode()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-4 rounded-xl transition hidden">
            キャンセル
          </button>
        </div>
      </form>
    </section>

    <!-- 3. 植物一覧 -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="font-bold text-sm text-slate-800">植物一覧</h2>
        <select id="selectSort" onchange="renderPlantsList()" class="text-xs border border-slate-300 rounded-lg px-2 py-1 bg-white focus:outline-none">
          <option value="nextWatering">次回水やりが近い順</option>
          <option value="registered">登録順</option>
          <option value="name">名前順 (50音)</option>
        </select>
      </div>

      <div id="plantsListContainer" class="space-y-3">
        <!-- カードがJavaScriptで動的生成される -->
      </div>
    </section>

  </main>

  <!-- トップへ戻るフローティングボタン -->
  <button id="btnScrollTop" onclick="scrollToTop()" class="fixed bottom-6 right-6 bg-emerald-600 text-white w-11 h-11 rounded-full shadow-lg flex items-center justify-center font-black text-sm opacity-0 pointer-events-none transition-all duration-300 z-40">
    ▲
  </button>

  <script>
    // PWA Service Worker 登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録スキップ:', err));
      });
    }

    const STORAGE_KEY = 'plants_data_v2';
    let plants = [];
    let currentBase64Image = null;

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // 水量の安全な正規化処理（0Lの登録に完全対応）
    function normalizeWater(val, fallbackVal) {
      let num = parseFloat(val);
      if (isNaN(num) || num < 0) {
        num = parseFloat(fallbackVal);
      }
      if (isNaN(num) || num < 0) {
        return 0.5;
      }
      // 50以上は過去のml表記（500ml -> 0.5L）
      if (num >= 50) {
        return Math.round((num / 1000) * 10) / 10;
      }
      // 0より大きく0.05未満の極小値に化けていた場合の安全復元
      if (num > 0 && num < 0.05) {
        let restored = num * 1000;
        if (restored >= 0.1 && restored <= 20) {
          return Math.round(restored * 10) / 10;
        }
        return 0.5;
      }
      return Math.round(num * 10) / 10;
    }

    // 単一データの安全サニタイズ
    function sanitizePlant(p) {
      const isDobudzuke = Boolean(
        p.isSoak === true ||
        p.isSoak === 'true' ||
        p.isSoak === 1 ||
        p.soak === true ||
        p.soak === 'true' ||
        p.isDobudzuke === true ||
        p.isDobudzuke === 'true' ||
        p.isDobudzuke === 1 ||
        p.dobudzuke === true ||
        p.dobudzuke === 'true' ||
        p.isDobuduke === true ||
        p.isDobuduke === 'true' ||
        p.dobuzuke === true ||
        p.dobuzuke === 'true' ||
        p.isDipping === true ||
        p.isDipping === 'true' ||
        p.method === 'dobudzuke'
      );

      return {
        id: String(p.id || ('plant_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5))),
        name: String(p.name || p.plantName || p.title || '名前なし'),
        interval: parseInt(p.interval, 10) || 7,
        water: normalizeWater(p.water, p.waterAmount),
        lastWatered: String(p.lastWatered || getTodayString()).replace(/\//g, '-'),
        isDobudzuke: isDobudzuke,
        image: p.image || null,
        fertilizerEnabled: Boolean(p.fertilizerEnabled === true || p.fertilizerEnabled === 'true'),
        fertilizerTypes: Array.isArray(p.fertilizerTypes) ? p.fertilizerTypes : [],
        fertilizerInterval: parseInt(p.fertilizerInterval, 10) || 1,
        fertilizerCycleIndex: parseInt(p.fertilizerCycleIndex, 10) || 0
      };
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            plants = parsed.map(p => sanitizePlant(p));
          } else {
            plants = [];
          }
        } catch(e) {
          plants = [];
        }
      }
      document.getElementById('inputLastWatered').value = getTodayString();
      updateDashboard();
      renderPlantsList();
    }

    function saveData(highlightId = null) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(plants));
      updateDashboard();
      renderPlantsList(highlightId);
    }

    // 写真のCanvas圧縮処理 (長辺400px / JPEG 70%)
    function handleImageSelect(event) {
      const file = event.target.files[0];
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      if (!file) {
        if (!currentBase64Image) {
          fileNameDisplay.innerText = '選択されていません';
        }
        return;
      }

      fileNameDisplay.innerText = file.name;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxSide = 400;

          if (width > height && width > maxSide) {
            height = Math.round((height * maxSide) / width);
            width = maxSide;
          } else if (height > maxSide) {
            width = Math.round((width * maxSide) / height);
            height = maxSide;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentBase64Image = canvas.toDataURL('image/jpeg', 0.7);
          showPreview(currentBase64Image);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function showPreview(dataUrl) {
      const previewImg = document.getElementById('previewImage');
      const placeholder = document.getElementById('previewPlaceholder');
      const btnRemove = document.getElementById('btnRemoveImage');

      if (dataUrl) {
        previewImg.src = dataUrl;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
        btnRemove.classList.remove('hidden');
      } else {
        previewImg.src = '';
        previewImg.classList.add('hidden');
        placeholder.classList.remove('hidden');
        btnRemove.classList.add('hidden');
      }
    }

    function removeSelectedImage() {
      currentBase64Image = null;
      document.getElementById('inputImage').value = '';
      document.getElementById('fileNameDisplay').innerText = '選択されていません';
      showPreview(null);
    }

    function handleWaterSelectChange() {
      const sel = document.getElementById('selectWater');
      const customInput = document.getElementById('inputCustomWater');
      if (sel.value === 'custom') {
        customInput.classList.remove('hidden');
        customInput.required = true;
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
      }
    }

    function toggleFertilizerSettings() {
      const enabled = document.getElementById('inputFertilizerEnabled').checked;
      const container = document.getElementById('fertilizerSettingsContainer');
      if (enabled) {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function getNextWateringDate(lastWateredStr, interval) {
      if (!lastWateredStr) return new Date();
      const parts = String(lastWateredStr).replace(/\//g, '-').split('-');
      if (parts.length < 3) return new Date();
      const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      d.setDate(d.getDate() + (parseInt(interval, 10) || 7));
      return d;
    }

    function getDiffDays(targetDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    // 水量自動集計エンジン（通常水やり＋どぶ漬け最大値）
    function updateDashboard() {
      let todayNormalSum = 0;
      let todayDobudzukeMax = 0;
      let todayPlantCount = 0;

      let tomorrowNormalSum = 0;
      let tomorrowDobudzukeMax = 0;
      let tomorrowPlantCount = 0;

      plants.forEach(plant => {
        const nextDate = getNextWateringDate(plant.lastWatered, plant.interval);
        const diff = getDiffDays(nextDate);

        // 本日水やり対象 (今日以前)
        if (diff <= 0) {
          todayPlantCount++;
          if (plant.isDobudzuke) {
            if (plant.water > todayDobudzukeMax) todayDobudzukeMax = plant.water;
          } else {
            todayNormalSum += plant.water;
          }
        }

        // 明日水やり対象 (あと1日)
        if (diff === 1) {
          tomorrowPlantCount++;
          if (plant.isDobudzuke) {
            if (plant.water > tomorrowDobudzukeMax) tomorrowDobudzukeMax = plant.water;
          } else {
            tomorrowNormalSum += plant.water;
          }
        }
      });

      const todayTotal = (todayNormalSum + todayDobudzukeMax).toFixed(1);
      const tomorrowTotal = (tomorrowNormalSum + tomorrowDobudzukeMax).toFixed(1);

      document.getElementById('todayWaterTotal').innerText = todayTotal;
      document.getElementById('todayCount').innerText = todayPlantCount;
      document.getElementById('todayBreakdown').innerText = `通常: ${todayNormalSum.toFixed(1)}L / どぶ漬け最大: ${todayDobudzukeMax.toFixed(1)}L`;

      document.getElementById('tomorrowWaterTotal').innerText = tomorrowTotal;
      document.getElementById('tomorrowCount').innerText = tomorrowPlantCount;
      document.getElementById('tomorrowBreakdown').innerText = `通常: ${tomorrowNormalSum.toFixed(1)}L / どぶ漬け最大: ${tomorrowDobudzukeMax.toFixed(1)}L`;

      document.getElementById('totalPlantCount').innerText = `${plants.length}株`;
    }

    // 本日の水やり一括完了
    function completeAllTodayWatering() {
      const todayStr = getTodayString();
      let count = 0;

      plants.forEach(plant => {
        const nextDate = getNextWateringDate(plant.lastWatered, plant.interval);
        const diff = getDiffDays(nextDate);
        if (diff <= 0) {
          plant.lastWatered = todayStr;
          if (plant.fertilizerEnabled && plant.fertilizerInterval > 1) {
            plant.fertilizerCycleIndex = (plant.fertilizerCycleIndex + 1) % plant.fertilizerInterval;
          }
          count++;
        }
      });

      if (count > 0) {
        saveData();
        alert(`本日対象の ${count}株 の水やりを完了として記録しました！`);
      } else {
        alert('本日水やり対象の植物はありません。');
      }
    }

    // 植物一覧の描画とソート
    function renderPlantsList(highlightId = null) {
      const container = document.getElementById('plantsListContainer');
      const sortType = document.getElementById('selectSort').value;

      let list = [...plants];

      if (sortType === 'nextWatering') {
        list.sort((a, b) => {
          const diffA = getDiffDays(getNextWateringDate(a.lastWatered, a.interval));
          const diffB = getDiffDays(getNextWateringDate(b.lastWatered, b.interval));
          return diffA - diffB;
        });
      } else if (sortType === 'name') {
        list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      }

      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-slate-400 text-xs border border-slate-200">登録されている植物がありません。</div>`;
        return;
      }

      list.forEach(plant => {
        const nextDate = getNextWateringDate(plant.lastWatered, plant.interval);
        const diff = getDiffDays(nextDate);
        const nextDateDisplay = `${nextDate.getMonth()+1}/${nextDate.getDate()}`;

        // 期日バッジ
        let badgeHtml = '';
        if (diff < 0) {
          badgeHtml = `<span class="bg-rose-100 text-rose-700 font-bold border border-rose-300 text-[10px] px-2 py-0.5 rounded-full flex-shrink-0">${Math.abs(diff)}日遅れ</span>`;
        } else if (diff === 0) {
          badgeHtml = `<span class="bg-amber-100 text-amber-700 font-bold border border-amber-300 text-[10px] px-2 py-0.5 rounded-full flex-shrink-0">本日水やり</span>`;
        } else if (diff === 1) {
          badgeHtml = `<span class="bg-blue-100 text-blue-600 font-bold border border-blue-200 text-[10px] px-2 py-0.5 rounded-full flex-shrink-0">明日水やり</span>`;
        } else {
          badgeHtml = `<span class="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full flex-shrink-0">あと${diff}日</span>`;
        }

        // 肥料ステータス表示
        let fertRowHtml = '';
        if (plant.fertilizerEnabled) {
          const isDue = (plant.fertilizerCycleIndex === 0);
          const typeNames = plant.fertilizerTypes && plant.fertilizerTypes.length > 0 
            ? plant.fertilizerTypes.join('・') 
            : '肥料';

          if (isDue) {
            fertRowHtml = `
              <div class="text-[11px] text-purple-700 font-bold flex items-center gap-1">
                <span class="bg-purple-100 border border-purple-200 px-2 py-0.5 rounded-md text-[10px] leading-none">
                  🧪 今回: ${typeNames}
                </span>
              </div>`;
          } else {
            const remaining = plant.fertilizerInterval - plant.fertilizerCycleIndex;
            fertRowHtml = `
              <div class="text-[11px] text-slate-500 flex items-center gap-1.5">
                <span class="bg-slate-100 text-slate-600 border border-slate-200 px-1.5 py-0.5 rounded text-[10px] leading-none">🧪 水のみ</span>
                <span class="text-slate-400 text-[10px]">(次回肥料: あと${remaining}回後)</span>
              </div>`;
          }
        } else {
          fertRowHtml = `
            <div class="text-[11px] text-slate-400 flex items-center">
              <span class="text-slate-400 text-[10px]">🧪 肥料: なし</span>
            </div>`;
        }

        const isHighlight = String(highlightId) === String(plant.id);
        const card = document.createElement('div');
        card.id = `plant-card-${plant.id}`;
        card.className = `bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2.5 transition ${isHighlight ? 'card-highlight' : ''}`;

        card.innerHTML = `
          <!-- 上部情報エリア -->
          <div class="flex gap-3 items-start min-w-0">
            <!-- 写真 -->
            <div class="w-16 h-16 rounded-xl border border-slate-200 bg-slate-50 flex-shrink-0 overflow-hidden flex items-center justify-center mt-0.5">
              ${plant.image 
                ? `<img src="${plant.image}" class="w-full h-full object-cover" alt="${plant.name}">` 
                : `<span class="text-[10px] text-slate-300">写真なし</span>`}
            </div>

            <!-- テキスト情報 -->
            <div class="space-y-1 min-w-0 flex-1">
              <!-- 1行目: 植物名 & 期日バッジ・次回予定 -->
              <div class="flex items-start justify-between gap-1">
                <h3 class="font-bold text-slate-800 text-sm break-all leading-snug">${plant.name}</h3>
                <div class="flex flex-col items-end flex-shrink-0 gap-0.5 ml-1">
                  ${badgeHtml}
                  <span class="text-[10px] font-bold text-slate-500">次回 ${nextDateDisplay}</span>
                </div>
              </div>

              <!-- 2行目: 間隔 & 水量 -->
              <div class="text-[11px] text-slate-500 flex items-center gap-1.5 flex-wrap">
                <span>間隔: ${plant.interval}日</span>
                <span class="text-slate-300">|</span>
                <span>水量: ${Number(plant.water).toFixed(1)}L</span>
                ${plant.isDobudzuke ? '<span class="text-amber-600 font-bold bg-amber-50 px-1 rounded border border-amber-200 text-[10px]">どぶ漬け</span>' : ''}
              </div>

              <!-- 3行目: 肥料ステータス -->
              ${fertRowHtml}

              <!-- 4行目: 前回水やり日 -->
              <div class="text-[10px] text-slate-400">
                前回: ${plant.lastWatered.replace(/-/g, '/')}
              </div>
            </div>
          </div>

          <!-- 下部操作ボタンバー -->
          <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
            <button onclick="completeSingleWatering('${plant.id}')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-2 px-3 rounded-xl border border-emerald-200 transition active:scale-98 flex items-center justify-center gap-1 shadow-sm">
              <span>💧 水やり完了</span>
            </button>
            <button onclick="startEditPlant('${plant.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3.5 rounded-xl transition">
              編集
            </button>
            <button onclick="deletePlant('${plant.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold py-2 px-3 rounded-xl border border-rose-200 transition">
              削除
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      // 画面中央スクロール
      if (highlightId) {
        setTimeout(() => {
          const targetCard = document.getElementById(`plant-card-${highlightId}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 100);
      }
    }

    // 個別水やり完了
    function completeSingleWatering(id) {
      const p = plants.find(x => String(x.id) === String(id));
      if (p) {
        p.lastWatered = getTodayString();
        if (p.fertilizerEnabled && p.fertilizerInterval > 1) {
          p.fertilizerCycleIndex = (p.fertilizerCycleIndex + 1) % p.fertilizerInterval;
        }
        saveData(id);
      }
    }

    // 登録・更新フォーム送信
    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editPlantId').value;
      const name = document.getElementById('inputName').value.trim();
      const interval = parseInt(document.getElementById('inputInterval').value, 10) || 7;
      const lastWatered = document.getElementById('inputLastWatered').value || getTodayString();
      const isDobudzuke = document.getElementById('inputIsDobudzuke').checked;

      const selWater = document.getElementById('selectWater').value;
      let water = 0.5;
      if (selWater === 'custom') {
        const customVal = document.getElementById('inputCustomWater').value;
        const parsed = parseFloat(customVal);
        water = isNaN(parsed) ? 0.5 : parsed;
      } else {
        const parsed = parseFloat(selWater);
        water = isNaN(parsed) ? 0.5 : parsed;
      }
      water = Math.round(water * 10) / 10;

      // 肥料設定の取得
      const fertilizerEnabled = document.getElementById('inputFertilizerEnabled').checked;
      let fertilizerTypes = [];
      let fertilizerInterval = 1;
      let fertilizerCycleIndex = 0;

      if (fertilizerEnabled) {
        const checkedBoxes = document.querySelectorAll('.fert-type-checkbox:checked');
        fertilizerTypes = Array.from(checkedBoxes).map(cb => cb.value);
        fertilizerInterval = parseInt(document.getElementById('inputFertilizerInterval').value, 10) || 1;
        fertilizerCycleIndex = parseInt(document.getElementById('inputFertilizerCycle').value, 10) || 0;
      }

      let targetId = editId;

      if (editId) {
        const p = plants.find(x => String(x.id) === String(editId));
        if (p) {
          p.name = name;
          p.interval = interval;
          p.water = water;
          p.lastWatered = lastWatered;
          p.isDobudzuke = isDobudzuke;
          p.image = currentBase64Image;
          p.fertilizerEnabled = fertilizerEnabled;
          p.fertilizerTypes = fertilizerTypes;
          p.fertilizerInterval = fertilizerInterval;
          p.fertilizerCycleIndex = fertilizerCycleIndex;
        }
      } else {
        const newId = 'plant_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        plants.push({
          id: newId,
          name: name,
          interval: interval,
          water: water,
          lastWatered: lastWatered,
          isDobudzuke: isDobudzuke,
          image: currentBase64Image,
          fertilizerEnabled: fertilizerEnabled,
          fertilizerTypes: fertilizerTypes,
          fertilizerInterval: fertilizerInterval,
          fertilizerCycleIndex: fertilizerCycleIndex
        });
        targetId = newId;
      }

      cancelEditMode();
      saveData(targetId);
    }

    // 編集モード開始
    function startEditPlant(id) {
      const p = plants.find(x => String(x.id) === String(id));
      if (!p) return;

      document.getElementById('editPlantId').value = p.id;
      document.getElementById('formTitle').innerText = '植物の編集';
      document.getElementById('btnSubmitForm').innerText = '更新する';
      document.getElementById('btnCancelEdit').classList.remove('hidden');

      document.getElementById('inputName').value = p.name;
      document.getElementById('inputInterval').value = p.interval;
      document.getElementById('inputLastWatered').value = p.lastWatered;
      document.getElementById('inputIsDobudzuke').checked = p.isDobudzuke;

      const selWater = document.getElementById('selectWater');
      const customInput = document.getElementById('inputCustomWater');
      const waterValStr = Number(p.water).toFixed(1);
      
      // 0.5L刻みで10.0Lまでの判定リスト
      const standardValues = [
        '0.5', '1.0', '1.5', '2.0', '2.5', '3.0', '3.5', '4.0', '4.5', '5.0',
        '5.5', '6.0', '6.5', '7.0', '7.5', '8.0', '8.5', '9.0', '9.5', '10.0'
      ];
      
      if (standardValues.includes(waterValStr)) {
        selWater.value = waterValStr;
        customInput.classList.add('hidden');
        customInput.value = '';
      } else {
        selWater.value = 'custom';
        customInput.value = p.water;
        customInput.classList.remove('hidden');
      }

      // 画像のセットとUI表示
      if (p.image) {
        currentBase64Image = p.image;
        showPreview(currentBase64Image);
        document.getElementById('fileNameDisplay').innerText = '登録済み写真';
      } else {
        currentBase64Image = null;
        showPreview(null);
        document.getElementById('fileNameDisplay').innerText = '選択されていません';
      }

      // 肥料設定の復元
      const fertCheckbox = document.getElementById('inputFertilizerEnabled');
      fertCheckbox.checked = Boolean(p.fertilizerEnabled);
      toggleFertilizerSettings();

      const typeBoxes = document.querySelectorAll('.fert-type-checkbox');
      typeBoxes.forEach(cb => {
        cb.checked = Array.isArray(p.fertilizerTypes) && p.fertilizerTypes.includes(cb.value);
      });

      document.getElementById('inputFertilizerInterval').value = p.fertilizerInterval || 1;
      document.getElementById('inputFertilizerCycle').value = (p.fertilizerCycleIndex === 0) ? '0' : '1';

      document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEditMode() {
      document.getElementById('editPlantId').value = '';
      document.getElementById('formTitle').innerText = '新しい植物を追加';
      document.getElementById('btnSubmitForm').innerText = '登録する';
      document.getElementById('btnCancelEdit').classList.add('hidden');

      document.getElementById('plantForm').reset();
      document.getElementById('inputLastWatered').value = getTodayString();
      document.getElementById('inputCustomWater').classList.add('hidden');
      document.getElementById('inputCustomWater').value = '';
      document.getElementById('inputFertilizerEnabled').checked = false;
      document.getElementById('fileNameDisplay').innerText = '選択されていません';
      toggleFertilizerSettings();
      removeSelectedImage();
    }

    // 削除
    function deletePlant(id) {
      if (confirm('この植物を削除しますか？')) {
        plants = plants.filter(x => String(x.id) !== String(id));
        saveData();
      }
    }

    // エクスポート / インポート
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(plants));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `plants_backup_${getTodayString()}.json`);
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            plants = imported.map(p => sanitizePlant(p));
            saveData();
            alert(`データの復元が完了しました！（${plants.length}株）`);
          } else {
            alert('正しいJSONデータ形式ではありません。');
          }
        } catch(err) {
          alert('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    // トップへ戻る
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('btnScrollTop');
      if (window.scrollY > 300) {
        btn.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        btn.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    // 起動
    loadData();
  </script>
</body>
</html>
