<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物水やり管理アプリ</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* スムーススクロール */
    html { scroll-behavior: smooth; }
    /* ハイライトアニメーション */
    @keyframes highlight {
      0% { background-color: #d1fae5; }
      100% { background-color: #ffffff; }
    }
    .card-highlight {
      animation: highlight 2s ease-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-24 relative">

  <h1 class="text-2xl font-bold mb-4 text-emerald-700 text-center">🌱 植物水やり管理</h1>

  <!-- 本日必要な水量・株数エリア -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-emerald-500">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">🌱 本日必要な水やり</h2>
      <span id="todayCount" class="text-xs font-bold bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full">0株</span>
    </div>
    
    <div class="flex justify-between items-baseline mb-2">
      <div>
        <span id="totalWater" class="text-3xl font-black text-emerald-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-400 text-right">
        通常: <span id="normalWater">0</span>L / 漬け最大: <span id="maxSoak">0</span>L
      </div>
    </div>

    <!-- 本日の水やり一括完了ボタン -->
    <button onclick="waterAllToday()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1 mt-1">
      ✨ 本日の水やりをすべて完了する
    </button>
  </div>

  <!-- 明日必要な水量・株数エリア (独立カード) -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-blue-500">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">📅 明日必要な水やり (事前準備)</h2>
      <span id="tomorrowCount" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full">0株</span>
    </div>
    
    <div class="flex justify-between items-baseline">
      <div>
        <span id="tomorrowTotalWater" class="text-3xl font-black text-blue-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-400 text-right">
        通常: <span id="tomorrowNormalWater">0</span>L / 漬け最大: <span id="tomorrowMaxSoak">0</span>L
      </div>
    </div>
  </div>

  <!-- データバックアップ / ロード機能 -->
  <div class="flex gap-2 mb-6">
    <button onclick="exportData()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition">
      📤 エクスポート (保存)
    </button>
    <label class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 px-3 rounded-lg font-bold transition text-center cursor-pointer">
      📥 インポート (ロード)
      <input type="file" id="importFile" accept=".json,text/plain,application/json,*/*" onchange="importData(event)" class="hidden">
    </label>
  </div>

  <!-- 登録・編集フォーム -->
  <form id="plantForm" onsubmit="savePlant(event)" class="bg-white p-4 rounded-xl shadow-md mb-6">
    <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-700">新しい植物を追加</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の名前</label>
      <input type="text" id="name" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">水やり間隔 (日)</label>
        <input type="number" id="interval" value="7" required min="1" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">1回の水量 (L)</label>
        <select id="waterSelect" onchange="toggleCustomWaterInput()" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500 bg-white mb-1">
          <option value="0.5">0.5 L</option>
          <option value="1">1.0 L</option>
          <option value="1.5">1.5 L</option>
          <option value="2">2.0 L</option>
          <option value="2.5">2.5 L</option>
          <option value="3">3.0 L</option>
          <option value="3.5">3.5 L</option>
          <option value="4">4.0 L</option>
          <option value="4.5">4.5 L</option>
          <option value="5">5.0 L</option>
          <option value="custom">その他 (手入力)</option>
        </select>
        <!-- 手入力用インプット（「その他」選択時のみ表示） -->
        <input type="number" id="waterCustom" step="0.1" min="0" placeholder="水量 (L)" class="hidden w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">前回の水やり日</label>
      <input type="date" id="lastWatered" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="flex items-center mb-4">
      <input type="checkbox" id="isSoak" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
      <label for="isSoak" class="ml-2 text-xs font-semibold text-slate-700">どぶ漬け（浸漬）で水やりする</label>
    </div>

    <div class="flex gap-2">
      <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">
        登録する
      </button>
      <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg text-sm">
        キャンセル
      </button>
    </div>
  </form>

  <!-- 植物一覧ヘッダー（並び替え切り替えドロップダウン付き） -->
  <div class="mb-2 flex justify-between items-center">
    <h2 class="text-sm font-bold text-slate-600">植物一覧</h2>
    <div class="flex items-center gap-1">
      <label for="sortMode" class="text-xs text-slate-400 font-semibold">並び順:</label>
      <select id="sortMode" onchange="renderList()" class="text-xs bg-white border rounded-lg px-2 py-1 text-slate-700 font-semibold focus:outline-emerald-500 shadow-sm">
        <option value="nextDate">次回水やりが近い順</option>
        <option value="created">登録順</option>
        <option value="name">名前順 (50音)</option>
      </select>
    </div>
  </div>

  <div id="plantList" class="space-y-3"></div>

  <!-- トップに戻るフローティングボタン -->
  <button id="scrollToTopBtn" onclick="scrollToTop()" class="fixed bottom-6 right-6 bg-emerald-600 text-white p-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 hover:bg-emerald-700 focus:outline-none z-50">
    ▲
  </button>

  <script>
    let plants = JSON.parse(localStorage.getItem('plants')) || [];
    let lastEditedName = null;

    // 本日の日付を YYYY-MM-DD 形式で取得
    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 単一項目の整形・正規化
    function normalizePlant(item) {
      if (!item || typeof item !== 'object') return null;

      const name = item.name || item.plantName || item.title || '無題の植物';
      let interval = parseInt(item.interval || item.intervalDays || item.waterInterval || 7);
      if (isNaN(interval) || interval <= 0) interval = 7;

      let waterAmount = parseFloat(item.waterAmount || item.water || item.amount || 0.5);
      if (isNaN(waterAmount)) waterAmount = 0.5;
      if (waterAmount >= 10) waterAmount = parseFloat((waterAmount / 1000).toFixed(2)); // ml -> L 変換

      let lastWatered = item.lastWatered || item.lastWateredDate || item.date || getTodayString();

      return {
        id: item.id || (Date.now() + Math.random()),
        name: String(name),
        interval: interval,
        waterAmount: waterAmount,
        lastWatered: String(lastWatered),
        isSoak: Boolean(item.isSoak || item.soak || item.dobu)
      };
    }

    // 既存データの互換チェック＆自動復元
    function migrateData() {
      if (!Array.isArray(plants)) {
        plants = [];
        return;
      }
      plants = plants.map(normalizePlant).filter(Boolean);
      localStorage.setItem('plants', JSON.stringify(plants));
    }

    // 初期化
    migrateData();
    document.getElementById('lastWatered').value = getTodayString();

    // 手入力フィールドの表示切替
    function toggleCustomWaterInput() {
      const select = document.getElementById('waterSelect');
      const customInput = document.getElementById('waterCustom');
      if (select.value === 'custom') {
        customInput.classList.remove('hidden');
        customInput.required = true;
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
      }
    }

    // 水量の値を取得する関数
    function getSelectedWaterAmount() {
      const select = document.getElementById('waterSelect');
      if (select.value === 'custom') {
        return parseFloat(document.getElementById('waterCustom').value) || 0;
      }
      return parseFloat(select.value);
    }

    // 水量の値をフォームにセットする関数（編集用）
    function setSelectedWaterAmount(val) {
      const select = document.getElementById('waterSelect');
      const customInput = document.getElementById('waterCustom');
      const presetValues = ["0.5", "1", "1.5", "2", "2.5", "3", "3.5", "4", "4.5", "5"];

      if (presetValues.includes(String(val))) {
        select.value = String(val);
        customInput.classList.add('hidden');
        customInput.required = false;
        customInput.value = '';
      } else {
        select.value = 'custom';
        customInput.classList.remove('hidden');
        customInput.required = true;
        customInput.value = val;
      }
    }

    // データ保存
    function savePlantsToStorage() {
      localStorage.setItem('plants', JSON.stringify(plants));
      renderList();
    }

    // 次回水やり日の計算関数
    function getNextWaterDate(lastWatered, interval) {
      const date = new Date(lastWatered);
      date.setDate(date.getDate() + parseInt(interval));
      return date;
    }

    // リスト描画
    function renderList() {
      const listEl = document.getElementById('plantList');
      listEl.innerHTML = '';

      const sortMode = document.getElementById('sortMode').value;
      let displayPlants = [...plants];

      if (sortMode === 'nextDate') {
        displayPlants.sort((a, b) => {
          const nextA = getNextWaterDate(a.lastWatered, a.interval);
          const nextB = getNextWaterDate(b.lastWatered, b.interval);
          return nextA - nextB;
        });
      } else if (sortMode === 'name') {
        displayPlants.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      } else if (sortMode === 'created') {
        displayPlants.sort((a, b) => a.id - b.id);
      }

      // 本日用変数の初期化
      let normalSum = 0;
      let maxSoak = 0;
      let todayPlantCount = 0;

      // 明日用変数の初期化
      let tomorrowNormalSum = 0;
      let tomorrowMaxSoak = 0;
      let tomorrowPlantCount = 0;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      displayPlants.forEach((plant) => {
        const originalIndex = plants.findIndex(p => p.id === plant.id);
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        
        const diffDays = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        const amount = parseFloat(plant.waterAmount) || 0;

        // 本日必要な場合（今日以前＝予定日当日または遅れているもの）
        if (diffDays <= 0) {
          todayPlantCount++;
          if (plant.isSoak) {
            if (amount > maxSoak) maxSoak = amount;
          } else {
            normalSum += amount;
          }
        }

        // 明日必要な場合（明日が予定日のもの）
        if (diffDays === 1) {
          tomorrowPlantCount++;
          if (plant.isSoak) {
            if (amount > tomorrowMaxSoak) tomorrowMaxSoak = amount;
          } else {
            tomorrowNormalSum += amount;
          }
        }

        let badgeClass = "bg-slate-100 text-slate-600";
        let badgeText = `あと ${diffDays} 日`;
        if (diffDays === 0) {
          badgeClass = "bg-amber-100 text-amber-700 font-bold border border-amber-300";
          badgeText = "今日が予定日！";
        } else if (diffDays === 1) {
          badgeClass = "bg-blue-100 text-blue-700 font-bold border border-blue-300";
          badgeText = "明日が予定日";
        } else if (diffDays < 0) {
          badgeClass = "bg-rose-100 text-rose-700 font-bold border border-rose-300";
          badgeText = `${Math.abs(diffDays)} 日遅れ！`;
        }

        const card = document.createElement('div');
        card.id = `plant-card-${encodeURIComponent(plant.name)}`;
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 relative transition-all";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-bold text-slate-800 text-base">${plant.name}</h3>
              <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeClass} mt-1">${badgeText}</span>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400">次回予定</span>
              <div class="text-xs font-bold text-slate-700">${nextDate.getFullYear()}/${nextDate.getMonth()+1}/${nextDate.getDate()}</div>
            </div>
          </div>
          
          <div class="text-xs text-slate-500 mb-3 space-y-0.5">
            <div>間隔: <span class="font-semibold text-slate-700">${plant.interval}日</span> / 水量: <span class="font-semibold text-slate-700">${amount} L</span> ${plant.isSoak ? '<span class="text-amber-600 font-bold">(どぶ漬け)</span>' : ''}</div>
            <div>前回水やり: ${plant.lastWatered}</div>
          </div>

          <div class="flex gap-2 pt-2 border-t border-slate-50">
            <button onclick="waterNow(${originalIndex})" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-1.5 rounded transition">
              💧 今日水やりした
            </button>
            <button onclick="editPlant(${originalIndex})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1.5 rounded">編集</button>
            <button onclick="deletePlant(${originalIndex})" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1.5 rounded">削除</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      // 本日の表示更新
      const total = normalSum + maxSoak;
      document.getElementById('todayCount').innerText = `${todayPlantCount}株`;
      document.getElementById('normalWater').innerText = parseFloat(normalSum.toFixed(2));
      document.getElementById('maxSoak').innerText = parseFloat(maxSoak.toFixed(2));
      document.getElementById('totalWater').innerText = parseFloat(total.toFixed(2));

      // 明日の表示更新
      const tomorrowTotal = tomorrowNormalSum + tomorrowMaxSoak;
      document.getElementById('tomorrowCount').innerText = `${tomorrowPlantCount}株`;
      document.getElementById('tomorrowNormalWater').innerText = parseFloat(tomorrowNormalSum.toFixed(2));
      document.getElementById('tomorrowMaxSoak').innerText = parseFloat(tomorrowMaxSoak.toFixed(2));
      document.getElementById('tomorrowTotalWater').innerText = parseFloat(tomorrowTotal.toFixed(2));

      // 編集後スクロール＆強調
      if (lastEditedName) {
        setTimeout(() => {
          const targetCard = document.getElementById(`plant-card-${encodeURIComponent(lastEditedName)}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.classList.add('card-highlight');
          }
          lastEditedName = null;
        }, 100);
      }
    }

    // 今日の水やり完了処理（単体）
    function waterNow(index) {
      plants[index].lastWatered = getTodayString();
      lastEditedName = plants[index].name;
      savePlantsToStorage();
    }

    // 本日の水やりをすべて完了
    function waterAllToday() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let count = 0;

      plants.forEach(plant => {
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        if (nextDate <= today) {
          plant.lastWatered = getTodayString();
          count++;
        }
      });

      if (count > 0) {
        savePlantsToStorage();
        alert(`${count}件の植物の水やりを完了しました！`);
      } else {
        alert("本日水やりが必要な植物はありません。");
      }
    }

    // フォーム送信（新規追加 / 編集保存）
    function savePlant(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);
      const name = document.getElementById('name').value.trim();

      if (!name) return;
      
      const data = {
        id: index === -1 ? (Date.now() + Math.random()) : plants[index].id,
        name: name,
        interval: parseInt(document.getElementById('interval').value) || 7,
        waterAmount: getSelectedWaterAmount(),
        lastWatered: document.getElementById('lastWatered').value || getTodayString(),
        isSoak: document.getElementById('isSoak').checked
      };

      if (index === -1) {
        plants.push(data);
      } else {
        plants[index] = data;
      }

      lastEditedName = name;
      resetForm();
      savePlantsToStorage();
    }

    // 編集フォーム呼び出し
    function editPlant(index) {
      const p = plants[index];
      document.getElementById('name').value = p.name;
      document.getElementById('interval').value = p.interval;
      setSelectedWaterAmount(p.waterAmount);
      document.getElementById('lastWatered').value = p.lastWatered;
      document.getElementById('isSoak').checked = p.isSoak;
      document.getElementById('editIndex').value = index;

      document.getElementById('formTitle').innerText = "植物の編集";
      document.getElementById('submitBtn').innerText = "更新する";
      document.getElementById('cancelBtn').classList.remove('hidden');
      
      document.getElementById('plantForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 削除処理
    function deletePlant(index) {
      if (confirm(`${plants[index].name} を削除してもよろしいですか？`)) {
        plants.splice(index, 1);
        savePlantsToStorage();
      }
    }

    // フォーム初期化
    function resetForm() {
      document.getElementById('plantForm').reset();
      document.getElementById('editIndex').value = "-1";
      document.getElementById('lastWatered').value = getTodayString();
      setSelectedWaterAmount(0.5); // デフォルト 0.5L
      document.getElementById('formTitle').innerText = "新しい植物を追加";
      document.getElementById('submitBtn').innerText = "登録する";
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    // トップに戻るスクロール
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const topBtn = document.getElementById('scrollToTopBtn');
      if (window.scrollY > 300) {
        topBtn.classList.remove('opacity-0', 'pointer-events-none');
        topBtn.classList.add('opacity-100');
      } else {
        topBtn.classList.remove('opacity-100');
        topBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    // データ出力 (Export) - Blob方式
    function exportData() {
      const jsonStr = JSON.stringify(plants, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = url;
      downloadAnchor.download = `plant_data_${getTodayString()}.json`;
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
