<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物水やり管理アプリ</title>

  <!-- PWA・ホーム画面設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="水やり管理">
  <meta name="theme-color" content="#047857">

  <!-- 🌱 PWA用アイコン・Manifest設定 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

  <!-- PWA判定を通すためのManifest定義 -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"植物水やり管理","short_name":"水やり管理","start_url":"./","display":"standalone","background_color":"#f1f5f9","theme_color":"#047857","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>","sizes":"192x192 512x512","type":"image/svg+xml","purpose":"any maskable"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    @keyframes highlight {
      0% { background-color: #d1fae5; }
      100% { background-color: #ffffff; }
    }
    .card-highlight { animation: highlight 2s ease-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-24 relative">

  <h1 class="text-2xl font-bold mb-4 text-emerald-700 text-center">🌱 植物水やり管理</h1>

  <!-- 本日必要な水量・株数エリア -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-emerald-500">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">🌱 本日必要な水やり</h2>
      <span id="todayCount" class="text-xs font-bold bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full">0株</span>
    </div>
    <div class="flex justify-between items-baseline mb-2">
      <div>
        <span id="totalWater" class="text-3xl font-black text-emerald-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-400 text-right">
        通常: <span id="normalWater">0</span>L / 漬け最大: <span id="maxSoak">0</span>L
      </div>
    </div>
    <button type="button" id="waterAllBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 px-3 rounded-lg shadow-sm transition flex items-center justify-center gap-1 mt-1">
      ✨ 本日の水やりをすべて完了する
    </button>
  </div>

  <!-- 明日必要な水量・株数エリア -->
  <div class="bg-white p-4 rounded-xl shadow-md mb-3 border-l-4 border-blue-500">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">📅 明日必要な水やり (事前準備)</h2>
      <span id="tomorrowCount" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full">0株</span>
    </div>
    <div class="flex justify-between items-baseline">
      <div>
        <span id="tomorrowTotalWater" class="text-3xl font-black text-blue-600">0</span>
        <span class="text-sm font-semibold text-slate-600"> L</span>
      </div>
      <div class="text-xs text-slate-400 text-right">
        通常: <span id="tomorrowNormalWater">0</span>L / 漬け最大: <span id="tomorrowMaxSoak">0</span>L
      </div>
    </div>
  </div>

  <!-- データバックアップ / ロード機能 -->
  <div class="flex gap-2 mb-6">
    <button type="button" id="exportBtn" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 px-3 rounded-lg font-bold transition">
      📤 エクスポート (保存)
    </button>
    <label class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2.5 px-3 rounded-lg font-bold transition text-center cursor-pointer block">
      📥 インポート (ロード)
      <input type="file" id="importFile" accept=".json,text/plain,application/json" class="hidden">
    </label>
  </div>

  <!-- 登録・編集フォーム -->
  <form id="plantForm" onsubmit="return false;" class="bg-white p-4 rounded-xl shadow-md mb-6">
    <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-700">新しい植物を追加</h2>
    <input type="hidden" id="editIndex" value="-1">
    <input type="hidden" id="imageData" value="">
    
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の名前 <span class="text-rose-500">*</span></label>
      <input type="text" id="name" placeholder="例: パキラ" required class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <!-- 写真選択エリア -->
    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">植物の写真 (任意)</label>
      <div class="flex items-center gap-3">
        <div id="formImagePreview" class="w-14 h-14 rounded-lg bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center overflow-hidden flex-shrink-0 text-slate-400 text-xs">
          なし
        </div>
        <div class="flex-1">
          <label class="inline-block bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg border border-slate-200 transition cursor-pointer">
            📷 写真を選択
            <input type="file" id="formImageInput" accept="image/*" class="hidden">
          </label>
          <button type="button" id="removeImageBtn" class="hidden text-xs text-rose-500 ml-2 hover:underline">削除</button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">水やり間隔 (日)</label>
        <input type="number" id="interval" value="7" min="1" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">1回の水量 (L)</label>
        <select id="waterSelect" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500 bg-white mb-1">
          <option value="0.5">0.5 L</option>
          <option value="1">1.0 L</option>
          <option value="1.5">1.5 L</option>
          <option value="2">2.0 L</option>
          <option value="2.5">2.5 L</option>
          <option value="3">3.0 L</option>
          <option value="3.5">3.5 L</option>
          <option value="4">4.0 L</option>
          <option value="4.5">4.5 L</option>
          <option value="5">5.0 L</option>
          <option value="custom">その他 (手入力)</option>
        </select>
        <input type="number" id="waterCustom" step="0.1" min="0" placeholder="水量 (L)" class="hidden w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">前回の水やり日</label>
      <input type="date" id="lastWatered" class="w-full border rounded-lg p-2 text-sm focus:outline-emerald-500">
    </div>

    <div class="flex items-center mb-4">
      <input type="checkbox" id="isSoak" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
      <label for="isSoak" class="ml-2 text-xs font-semibold text-slate-700">どぶ漬け（浸漬）で水やりする</label>
    </div>

    <div class="flex gap-2">
      <button type="button" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">
        登録する
      </button>
      <button type="button" id="cancelBtn" class="hidden bg-slate-300 text-slate-700 font-bold py-2 px-3 rounded-lg text-sm">
        キャンセル
      </button>
    </div>
  </form>

  <!-- 植物一覧ヘッダー -->
  <div class="mb-2 flex justify-between items-center">
    <h2 class="text-sm font-bold text-slate-600">植物一覧</h2>
    <div class="flex items-center gap-1">
      <label for="sortMode" class="text-xs text-slate-400 font-semibold">並び順:</label>
      <select id="sortMode" class="text-xs bg-white border rounded-lg px-2 py-1 text-slate-700 font-semibold focus:outline-emerald-500 shadow-sm">
        <option value="nextDate">次回水やりが近い順</option>
        <option value="created">登録順</option>
        <option value="name">名前順 (50音)</option>
      </select>
    </div>
  </div>

  <div id="plantList" class="space-y-3"></div>

  <script>
    // PWAインストール条件を満たすための軽量Service Worker登録
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', () => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    let plants = [];
    let lastEditedName = null;

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function normalizePlant(item) {
      if (!item || typeof item !== 'object') return null;
      return {
        id: item.id || (Date.now() + Math.random()),
        name: String(item.name || item.plantName || '無題の植物'),
        interval: parseInt(item.interval || item.intervalDays || 7, 10) || 7,
        waterAmount: parseFloat(item.waterAmount || item.water || 0.5) || 0.5,
        lastWatered: String(item.lastWatered || getTodayString()),
        isSoak: Boolean(item.isSoak || item.soak),
        image: item.image || item.photo || null
      };
    }

    function loadPlants() {
      try {
        const stored = localStorage.getItem('plants');
        if (stored) {
          plants = JSON.parse(stored).map(normalizePlant).filter(Boolean);
        }
      } catch (e) {
        plants = [];
      }
    }

    function savePlants() {
      try {
        localStorage.setItem('plants', JSON.stringify(plants));
      } catch (e) {
        alert("画像容量が大きすぎるため、画像を除外して保存します。");
        plants = plants.map(p => ({ ...p, image: null }));
        localStorage.setItem('plants', JSON.stringify(plants));
      }
      renderList();
    }

    function getNextWaterDate(lastWatered, interval) {
      const d = new Date(lastWatered);
      if (isNaN(d.getTime())) return new Date();
      d.setDate(d.getDate() + parseInt(interval, 10));
      return d;
    }

    function renderList() {
      const listEl = document.getElementById('plantList');
      if (!listEl) return;
      listEl.innerHTML = '';

      const sortMode = document.getElementById('sortMode').value;
      let displayPlants = [...plants];

      if (sortMode === 'nextDate') {
        displayPlants.sort((a, b) => getNextWaterDate(a.lastWatered, a.interval) - getNextWaterDate(b.lastWatered, b.interval));
      } else if (sortMode === 'name') {
        displayPlants.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      } else if (sortMode === 'created') {
        displayPlants.sort((a, b) => a.id - b.id);
      }

      let normalSum = 0, maxSoak = 0, todayCount = 0;
      let tomorrowNormalSum = 0, tomorrowMaxSoak = 0, tomorrowCount = 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      displayPlants.forEach(plant => {
        const idx = plants.findIndex(p => p.id === plant.id);
        const nextDate = getNextWaterDate(plant.lastWatered, plant.interval);
        nextDate.setHours(0, 0, 0, 0);
        
        const diff = Math.ceil((nextDate - today) / (1000 * 60 * 60 * 24));
        const amount = parseFloat(plant.waterAmount) || 0;

        if (diff <= 0) {
          todayCount++;
          if (plant.isSoak) { if (amount > maxSoak) maxSoak = amount; }
          else { normalSum += amount; }
        }

        if (diff === 1) {
          tomorrowCount++;
          if (plant.isSoak) { if (amount > tomorrowMaxSoak) tomorrowMaxSoak = amount; }
          else { tomorrowNormalSum += amount; }
        }

        let badgeClass = "bg-slate-100 text-slate-600";
        let badgeText = `あと ${diff} 日`;
        if (diff === 0) { badgeClass = "bg-amber-100 text-amber-700 font-bold"; badgeText = "今日が予定日！"; }
        else if (diff === 1) { badgeClass = "bg-blue-100 text-blue-700 font-bold"; badgeText = "明日が予定日"; }
        else if (diff < 0) { badgeClass = "bg-rose-100 text-rose-700 font-bold"; badgeText = `${Math.abs(diff)} 日遅れ！`; }

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-slate-800 text-base truncate">${plant.name}</h3>
            <div class="text-right text-xs font-bold text-slate-700">${nextDate.getFullYear()}/${nextDate.getMonth()+1}/${nextDate.getDate()}</div>
          </div>
          <div class="flex justify-between items-center gap-2 mb-2">
            <div class="text-xs text-slate-500">
              <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${badgeClass} mb-1">${badgeText}</span>
              <div>間隔: ${plant.interval}日 / 水量: ${amount} L ${plant.isSoak ? '(どぶ漬け)' : ''}</div>
              <div>前回: ${plant.lastWatered}</div>
            </div>
            ${plant.image ? `<img src="${plant.image}" class="w-14 h-14 rounded-lg object-cover">` : ''}
          </div>
          <div class="flex gap-2 pt-2 border-t border-slate-50">
            <button type="button" onclick="waterNow(${idx})" class="flex-1 bg-emerald-50 text-emerald-700 text-xs font-bold py-1.5 rounded">💧 今日水やりした</button>
            <button type="button" onclick="editPlant(${idx})" class="text-xs bg-slate-100 text-slate-600 px-2 py-1.5 rounded">編集</button>
            <button type="button" onclick="deletePlant(${idx})" class="text-xs bg-rose-50 text-rose-600 px-2 py-1.5 rounded">削除</button>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('todayCount').innerText = `${todayCount}株`;
      document.getElementById('normalWater').innerText = normalSum.toFixed(1);
      document.getElementById('maxSoak').innerText = maxSoak.toFixed(1);
      document.getElementById('totalWater').innerText = (normalSum + maxSoak).toFixed(1);

      document.getElementById('tomorrowCount').innerText = `${tomorrowCount}株`;
      document.getElementById('tomorrowNormalWater').innerText = tomorrowNormalSum.toFixed(1);
      document.getElementById('tomorrowMaxSoak').innerText = tomorrowMaxSoak.toFixed(1);
      document.getElementById('tomorrowTotalWater').innerText = (tomorrowNormalSum + tomorrowMaxSoak).toFixed(1);
    }

    function waterNow(idx) {
      if (plants[idx]) {
        plants[idx].lastWatered = getTodayString();
        savePlants();
      }
    }

    function editPlant(idx) {
      const p = plants[idx];
      if (!p) return;
      document.getElementById('name').value = p.name;
      document.getElementById('interval').value = p.interval;
      document.getElementById('lastWatered').value = p.lastWatered;
      document.getElementById('isSoak').checked = p.isSoak;
      document.getElementById('editIndex').value = idx;
      document.getElementById('imageData').value = p.image || '';
      document.getElementById('submitBtn').innerText = "更新する";
      document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function deletePlant(idx) {
      if (confirm("本当に削除しますか？")) {
        plants.splice(idx, 1);
        savePlants();
      }
    }

    function resetForm() {
      document.getElementById('name').value = '';
      document.getElementById('interval').value = '7';
      document.getElementById('editIndex').value = "-1";
      document.getElementById('lastWatered').value = getTodayString();
      document.getElementById('isSoak').checked = false;
      document.getElementById('imageData').value = '';
      document.getElementById('submitBtn').innerText = "登録する";
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    // イベントリスナー設定
    document.addEventListener('DOMContentLoaded', () => {
      loadPlants();
      resetForm();

      document.getElementById('submitBtn').addEventListener('click', (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        if (!name) { alert("名前を入力してください"); return; }

        const idx = parseInt(document.getElementById('editIndex').value, 10);
        const data = {
          id: idx === -1 ? (Date.now() + Math.random()) : plants[idx].id,
          name: name,
          interval: parseInt(document.getElementById('interval').value, 10) || 7,
          waterAmount: parseFloat(document.getElementById('waterSelect').value) || 0.5,
          lastWatered: document.getElementById('lastWatered').value || getTodayString(),
          isSoak: document.getElementById('isSoak').checked,
          image: document.getElementById('imageData').value || null
        };

        if (idx === -1) plants.push(data);
        else plants[idx] = data;

        resetForm();
        savePlants();
        alert("保存しました！");
      });

      document.getElementById('cancelBtn').addEventListener('click', resetForm);
      document.getElementById('sortMode').addEventListener('change', renderList);

      document.getElementById('waterAllBtn').addEventListener('click', () => {
        const todayStr = getTodayString();
        plants.forEach(p => p.lastWatered = todayStr);
        savePlants();
        alert("本日の水やりをすべて完了しました！");
      });

      document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(plants, null, 2)], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `plant_data.json`;
        a.click();
      });

      document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const json = JSON.parse(evt.target.result);
            const list = Array.isArray(json) ? json : (json.plants || []);
            plants = list.map(normalizePlant).filter(Boolean);
            savePlants();
            alert(`読み込み成功！（${plants.length}件）`);
          } catch (err) {
            alert("読み込みエラー: ファイル形式が違います");
          }
        };
        reader.readAsText(file);
      });
    });
  </script>
</body>
</html>
